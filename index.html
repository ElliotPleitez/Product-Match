<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Product Match">
<meta name="theme-color" content="#0f2f5e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Product Match</title>
<style>
:root{--bg:#f2f3f7;--card:#fff;--ink:#141c28;--muted:#6b7686;--line:#e3e7ee;--accent:#1f5fbf;--teal:#0d9488;--good:#16a34a;--warn:#d97706;--bad:#dc2626;--gray:#9aa3af;--band:rgba(31,95,191,.32);--soft:#f6f8fb}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#171d27;--ink:#e7ecf3;--muted:#98a3b3;--line:#283140;--accent:#5b9bff;--band:rgba(91,155,255,.38);--soft:#1e2532}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif}
body.locked{overflow:hidden}
header.top{background:linear-gradient(125deg,#0f2f5e,#1f5fbf 60%,#0ea5a4);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 18px}
header.top h1{margin:0;font-size:22px;font-weight:700}
header.top .sub{opacity:.85;font-size:13px;margin-top:2px}
main{max-width:980px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 92px)}
section{margin-bottom:18px}
h2{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:6px 4px 8px;font-weight:600}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line);margin-bottom:10px}
.row{display:flex;align-items:baseline;gap:8px}
.spacer{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}.xsmall{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.grid .card{margin:0}
input,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-size:17px}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent);height:30px}
.inp input[type=number]{margin:8px 0 4px;font-size:20px;font-weight:600}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wt{font-weight:600;color:var(--muted);white-space:nowrap;text-align:right}
.vslider{width:100%;margin-top:8px}
.vslider.unset{opacity:.45}
select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-size:17px}
.inp select{margin:8px 0 4px;font-size:20px;font-weight:600}
.pfield{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;padding:0;accent-color:var(--accent);flex:none}
.wbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.wbox input{width:62px;padding:6px 8px;font-size:16px;text-align:center}
.pbody{margin-top:10px}
.pfield.off .pbody,.pfield.off .wbox{display:none}
.pfield .offnote{display:none;margin-top:6px}
.pfield.off .offnote{display:block}
.chip.na b{color:var(--gray)}
/* uniform list cards: ▲▼ left, content middle, Duplicate / Delete right */
.lcard{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:stretch}
.mv,.acts{display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.mv button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:15px;cursor:pointer}
.ltitle{display:block;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.acts button{font:inherit;font-size:12px;padding:8px 9px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;white-space:nowrap}
.acts .danger{color:var(--bad)}
.mv button:disabled{opacity:.3}
.lbody{cursor:pointer;min-width:0}
.listnote{font-size:12px;color:var(--muted);margin:2px 4px 10px}
/* collapsible sections */
h2.ctl{cursor:pointer;user-select:none;-webkit-user-select:none;display:flex;align-items:center}
.caret{display:inline-block;width:14px;transition:transform .2s ease;margin-right:4px}
section.collapsed .caret{transform:rotate(-90deg)}
section.collapsed .sec-body{display:none}
/* effects */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
main.anim>*{animation:fadeUp .25s ease both}
main.anim>*:nth-child(2){animation-delay:.04s}main.anim>*:nth-child(3){animation-delay:.08s}main.anim>*:nth-child(4){animation-delay:.12s}
.sheet:not(.hidden){animation:fadeIn .2s ease}
.sheet:not(.hidden) .sheet-card{animation:slideUp .28s cubic-bezier(.2,.8,.2,1)}
.flash{animation:flash 1s ease}
button{transition:transform .08s ease}
button:active:not(:disabled){transform:scale(.96)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--accent);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.block{display:block;width:100%;margin-top:6px}
.btn:disabled{opacity:.4}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:4px}
.pill{font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.item{cursor:pointer}
.item-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.item-actions button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:5px 11px}
.item-actions .danger{color:var(--bad)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:8px;padding:4px 8px;background:var(--soft);font-size:12px;line-height:1.25}
.chip b{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.chip.within{background:color-mix(in srgb,var(--good) 18%,transparent)}
.chip.near{background:color-mix(in srgb,var(--warn) 18%,transparent)}
.chip.far{background:color-mix(in srgb,var(--bad) 15%,transparent)}
.result-top{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex:none;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-size:36px;line-height:1}
.tag{font-size:11px;font-weight:700;letter-spacing:.7px;color:var(--teal)}
.pname{font-size:24px;font-weight:700;margin:2px 0}
.summary{flex:1;min-width:220px}
.fit{padding:10px 0;border-top:1px solid var(--line)}
.fit .row{flex-wrap:wrap}
.track{position:relative;height:12px;background:var(--soft);border:1px solid var(--line);border-radius:6px;margin-top:8px}
.band{position:absolute;top:1px;bottom:1px;background:var(--band);border-radius:5px}
.marker{position:absolute;top:-6px;width:4px;height:22px;margin-left:-2px;border-radius:2px}
.st{font-weight:600;font-size:14px;margin-left:auto}
.c-within{color:var(--good)}.c-near{color:var(--warn)}.c-far{color:var(--bad)}.c-missing,.c-excluded{color:var(--gray)}
.b-within{background:var(--good)}.b-near{background:var(--warn)}.b-far{background:var(--bad)}.b-missing,.b-excluded{background:var(--gray)}
.alts{display:flex;gap:8px;overflow-x:auto;margin-top:12px;align-items:center}
.alts button{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:6px 12px}
.rank{display:flex;align-items:center;gap:12px}
.badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--soft);flex:none;font-variant-numeric:tabular-nums}
.badge.first{background:var(--accent);color:#fff}
.sbar{width:80px;height:8px;border-radius:4px;background:var(--soft);overflow:hidden;flex:none}
.sbar i{display:block;height:100%}
.pct{font-weight:700;width:46px;text-align:right;font-variant-numeric:tabular-nums}
.sel{outline:2px solid var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.empty{text-align:center;padding:28px 12px}
.empty .big{font-size:40px}
.warn-text{color:var(--warn)}.err-text{color:var(--bad)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 2px 5px}
.pair{display:flex;gap:8px;align-items:center}
.pair span{color:var(--muted)}
.issue{font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.issue:first-child{border-top:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-card{background:var(--bg);width:100%;max-width:640px;height:calc(100% - env(safe-area-inset-top) - 12px);border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.sheet-head b{font-size:16px}
.sheet-body{flex:1;overflow-y:auto;padding:16px 14px calc(env(safe-area-inset-bottom) + 30px);-webkit-overflow-scrolling:touch}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:#141c28;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>

<body>
<header class="top">
  <h1 id="title">Product Match</h1>
  <div class="sub" id="subtitle"></div>
</header>
<main id="view"></main>

<nav class="tabs">
  <button data-tab="match"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Match</button>
  <button data-tab="params"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Parameters</button>
  <button data-tab="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>Products</button>
  <button data-tab="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Data</button>
</nav>

<div id="sheet" class="sheet hidden">
  <div class="sheet-card">
    <div class="sheet-head">
      <button class="link" id="sheetCancel">Cancel</button>
      <b id="sheetTitle"></b>
      <button class="link" id="sheetSave">Save</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<input type="file" id="fileIn" accept=".csv,text/csv,text/plain" hidden>
<div id="toast"></div>

<script>
"use strict";
/* ======================= STATE & STORAGE ======================= */
const KEY = 'productMatch.state.v1';
const $ = s => document.querySelector(s);
const view = $('#view');
// Parameter value types. dec = decimal places of accuracy.
const TYPES = {
  cm:      {label: 'cm (nearest 0.1)', unit: 'cm', dec: 1},
  percent: {label: '% (25% increments)', unit: '%', dec: 0},
  number:  {label: 'Number (resolution 1)'},
  boolean: {label: 'Y/N (Yes or No)'}
};
const BL = {yes: 'Yes', no: 'No', either: 'Either'};
// Input / slider resolution per type.
const RES = {cm: 0.1, percent: 25, number: 1};
const decOf = r => (String(r).split('.')[1] || '').length;
let S = load();

function blank(){ return {title: 'Product Match', parameters: [], products: [], inputs: {}, tab: null, selectedId: null, lastExport: null}; }
function fix(s){
  s.parameters = Array.isArray(s.parameters) ? s.parameters : [];
  s.products = Array.isArray(s.products) ? s.products : [];
  s.inputs = s.inputs || {};
  s.parameters.forEach(p => {
    if (p.weight == null || isNaN(p.weight)) p.weight = 5;
    if (!TYPES[p.type]) p.type = 'number';
    if (TYPES[p.type].unit) p.unit = TYPES[p.type].unit;
    if (p.type === 'boolean') { p.unit = ''; p.min = null; p.max = null; }
  });
  s.products.forEach(pr => { pr.ranges = pr.ranges || {}; pr.flags = pr.flags || {}; pr.rel = pr.rel || {}; });
  return s;
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.parameters) return fix(s); } catch (e) {}
  return blank();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Unable to save on this device. Export a CSV backup.'); }
}

/* ======================= UTILITIES ======================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const P = id => S.parameters.find(x => x.id === id);
const isBool = p => p.type === 'boolean';
const prec = p => TYPES[p.type] && TYPES[p.type].dec != null ? TYPES[p.type].dec : null;
function roundP(p, v){ if (v == null) return null; const d = prec(p); return d == null ? v : Number(v.toFixed(d)); }
// Allowable limits (percent defaults to 0–100).
function limits(p){ return [p.min ?? (p.type === 'percent' ? 0 : null), p.max ?? (p.type === 'percent' ? 100 : null)]; }
// Product values: snap to resolution, then keep within the allowable range.
function conformValue(p, v){
  if (v == null || isBool(p)) return v;
  let x = roundIn(p, v); const [lo, hi] = limits(p);
  if (lo != null && x < lo) x = roundIn(p, Math.ceil(lo / (RES[p.type] || 1) - 1e-9) * (RES[p.type] || 1));
  if (hi != null && x > hi) x = roundIn(p, Math.floor(hi / (RES[p.type] || 1) + 1e-9) * (RES[p.type] || 1));
  return x;
}
const conforms = (p, v) => v == null || conformValue(p, v) === v;
function ruleText(p){
  const r = p.type === 'cm' ? 'Steps of 0.1 cm' : p.type === 'percent' ? 'Steps of 25%' : p.type === 'number' ? 'Whole numbers' : 'Any value';
  const [lo, hi] = limits(p);
  return lo != null || hi != null ? `${r} within ${fmt(lo)} – ${fmt(hi)}` : r;
}
function nonConforming(){
  let n = 0;
  S.products.forEach(pr => S.parameters.forEach(p => { if (isBool(p)) return; const r = pr.ranges[p.id]; if (r && (!conforms(p, r[0]) || !conforms(p, r[1]))) n++; }));
  return n;
}
function conformAll(){
  S.products.forEach(pr => S.parameters.forEach(p => { if (isBool(p)) return; const r = pr.ranges[p.id]; if (r) pr.ranges[p.id] = [conformValue(p, r[0]), conformValue(p, r[1])]; }));
}
// Design inputs snap to the type's resolution (0.1 cm, 25%, 1).
function roundIn(p, v){
  if (v == null) return null;
  const r = RES[p.type];
  return r ? Number((Math.round(v / r) * r).toFixed(decOf(r))) : roundP(p, v);
}
function num(v){
  if (v === null || v === undefined) return null;
  const t = String(v).trim().replace(/[,$%]/g, '');
  if (t === '') return null;
  const n = Number(t);
  return isFinite(n) ? n : null;
}
function parseBool(v){
  const t = String(v ?? '').trim().toLowerCase();
  if (['yes', 'y', 'true', '1'].includes(t)) return 'yes';
  if (['no', 'n', 'false', '0'].includes(t)) return 'no';
  if (['either', 'both', 'any', 'yes/no', 'y/n'].includes(t)) return 'either';
  return null;
}
function fmt(v){
  if (v == null || isNaN(v)) return '—';
  const a = Math.abs(v);
  return Number(v).toLocaleString(undefined, {maximumFractionDigits: a >= 100 ? 0 : a >= 10 ? 1 : 3});
}
const plain = v => v == null ? '' : String(v);
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800); }
const configured = () => S.parameters.length > 0 && S.products.length > 0;
function localDate(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

/* ======================= RELEVANCE & WEIGHT ======================= */
// Each product can mark a parameter relevant (with its own weight) or not relevant (weight 0).
// A product with no entry uses the parameter's default weight.
function relOf(pr, p){
  const r = pr.rel && pr.rel[p.id];
  if (!r) return {on: true, w: p.weight};
  return {on: r.on !== false, w: r.w == null ? p.weight : r.w};
}
function wOf(pr, p){ const r = relOf(pr, p); return r.on ? r.w : 0; }

/* ======================= SCORING ======================= */
// Numeric: 100% when the input is within the product's range; outside it the score falls
// linearly with distance, reaching 0% at one-half of the reference span.
// Yes/No: 100% when the product allows the selected answer, otherwise 0%.
// Overall = weighted average using each product's weights (0 / not relevant = excluded).
function rng(pr, p){
  const r = pr.ranges[p.id];
  if (!r || r[0] == null || r[1] == null) return null;
  return [Math.min(r[0], r[1]), Math.max(r[0], r[1])];
}
function productExtent(p){
  let lo = Infinity, hi = -Infinity;
  S.products.forEach(pr => { if (wOf(pr, p) <= 0) return; const r = rng(pr, p); if (r) { lo = Math.min(lo, r[0]); hi = Math.max(hi, r[1]); } });
  return lo === Infinity ? null : [lo, hi];
}
// Range shown beside the input and used by the slider.
function sliderSpec(p){
  const d = prec(p);
  let lo = p.min, hi = p.max, src = 'Allowable';
  if (p.type === 'percent') { if (lo == null) lo = 0; if (hi == null) hi = 100; }
  if (lo == null || hi == null) {
    const e = productExtent(p);
    if (p.min == null && p.max == null) src = 'Products cover';
    if (lo == null) lo = e ? e[0] : 0;
    if (hi == null) hi = e ? e[1] : lo + 1;
  }
  // Slider moves at the type's resolution (0.1 cm, 25%), between the nearest
  // resolution points inside the range. Other types: one position per whole unit.
  const res = RES[p.type];
  if (!(hi > lo)) hi = lo + (res || 1);
  const rlo = lo, rhi = hi;
  let step, dec;
  if (res) {
    dec = decOf(res);
    const a = Math.ceil(lo / res - 1e-9) * res, b = Math.floor(hi / res + 1e-9) * res;
    if (b > a) { lo = Number(a.toFixed(dec)); hi = Number(b.toFixed(dec)); step = res; }
    else { step = hi - lo; dec = 6; }
  } else {
    const span = hi - lo, n = Math.max(1, Math.round(span)); step = span / n;
    dec = Number.isInteger(step) && Number.isInteger(lo) ? 0 : 6;
  }
  return {lo, hi, step, dec, src, rlo, rhi};
}
function refSpan(p){
  if (p.min != null && p.max != null && p.max > p.min) return p.max - p.min;
  if (p.type === 'percent') return 100;
  const e = productExtent(p);
  if (!e) return 1;
  return e[1] - e[0] > 0 ? e[1] - e[0] : Math.max(Math.abs(e[1]), 1);
}
function rank(){
  const act = S.parameters.filter(p => S.inputs[p.id] != null);
  const spans = {}; act.forEach(p => { if (!isBool(p)) spans[p.id] = refSpan(p); });
  const res = S.products.map(pr => {
    let ws = 0, ss = 0, within = 0, n = 0; const fits = {};
    act.forEach(p => {
      const v = S.inputs[p.id], w = wOf(pr, p);
      let s = 0, st = 'missing', d = null, r = null;
      if (isBool(p)) {
        r = pr.flags[p.id] || null;
        if (r) { if (r === 'either' || r === v) { s = 100; st = 'within'; } else st = 'far'; }
      } else {
        r = rng(pr, p);
        if (r) {
          if (v >= r[0] && v <= r[1]) { s = 100; st = 'within'; }
          else { d = v < r[0] ? v - r[0] : v - r[1]; s = Math.max(0, 100 - 200 * Math.abs(d) / spans[p.id]); st = s >= 60 ? 'near' : 'far'; }
        }
      }
      if (w > 0) { ws += w; ss += w * s; n++; if (st === 'within') within++; }
      fits[p.id] = {s, st, d, v, r, w, excluded: !(w > 0)};
    });
    return {pr, score: ws ? ss / ws : 0, within, n, fits};
  });
  res.sort((a, b) => b.score - a.score || b.n - a.n || b.within - a.within || S.products.indexOf(a.pr) - S.products.indexOf(b.pr));
  return {res, act};
}

/* ======================= VALIDATION ======================= */
function issues(){
  const out = [], seen = new Set();
  S.parameters.forEach(p => {
    const n = (p.name || '').trim();
    if (!n) out.push('A parameter has no name.');
    else if (seen.has(n.toLowerCase())) out.push(`Duplicate parameter name "${n}". Names must be unique for CSV import/export.`);
    seen.add(n.toLowerCase());
    if (p.min != null && p.max != null && p.min > p.max) out.push(`${n}: allowable minimum exceeds maximum.`);
  });
  S.products.forEach(pr => S.parameters.forEach(p => {
    if (wOf(pr, p) <= 0) return;
    if (isBool(p)) {
      if (!pr.flags[p.id]) out.push(`${pr.name}: no Yes/No value for ${p.name}; this parameter scores 0% for this product.`);
      return;
    }
    const raw = pr.ranges[p.id] || [null, null];
    if (raw[0] == null || raw[1] == null) { out.push(`${pr.name}: no complete range for ${p.name}; this parameter scores 0% for this product.`); return; }
    if (raw[0] > raw[1]) out.push(`${pr.name}: ${p.name} lower value exceeds upper value.`);
    const r = rng(pr, p);
    if (!conforms(p, raw[0]) || !conforms(p, raw[1])) out.push(`${pr.name}: ${p.name} ${fmt(r[0])}–${fmt(r[1])} does not match the parameter (${ruleText(p).toLowerCase()}).`);
  }));
  return out;
}

// Positions of list cards, used to keep the screen still and animate reordering.
function snapshot(){ const m = {}; view.querySelectorAll('[data-card]').forEach(el => m[el.dataset.card] = el.getBoundingClientRect().top); return m; }
// Re-render the current tab in place: no jump to the top. The card `keepId` stays where it was on screen.
function refresh(keepId, snap){
  snap = snap || snapshot();
  view.onclick = null; RENDER()(); updateHeader();
  const keep = keepId && view.querySelector(`[data-card="${keepId}"]`);
  if (keep && snap[keepId] != null) window.scrollBy(0, keep.getBoundingClientRect().top - snap[keepId]);
  if (!reduceMotion()) view.querySelectorAll('[data-card]').forEach(el => {
    const old = snap[el.dataset.card];
    if (old == null) return;
    const d = old - el.getBoundingClientRect().top;
    if (Math.abs(d) > 1) el.animate([{transform: `translateY(${d}px)`}, {transform: 'none'}], {duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)'});
  });
  if (keep) { keep.classList.remove('flash'); void keep.offsetWidth; keep.classList.add('flash'); }
  return keep;
}
// After saving an editor: stay in place; scroll a new item into view.
function afterSave(id, isNew){

function moveItem(arr, i, dir, id){

// Uniform, collapsible section (tap the heading to collapse or expand; remembered).
function section(key, title, action, body, h2id){
  const c = S.collapsed && S.collapsed[key];
  return `<section class="${c ? 'collapsed' : ''}" data-section="${key}">
    <div class="sec-h"><h2 class="ctl" data-collapse="${key}"${h2id ? ` id="${h2id}"` : ''}><span class="caret">▾</span><span class="ttl">${title}</span></h2>${action || ''}</div>

function slide(sec, closing){

function renderMatch(){

    section('m-list', 'All Products', '', `<div id="list"></div>
      <div class="legend"><span style="--c:var(--good)">Within range / matches</span><span style="--c:var(--warn)">Outside, near</span><span style="--c:var(--bad)">Outside, far / no match</span><span style="--c:var(--gray)">Not relevant / no data</span></div>`, 'listTitle');

function setInput(id, v){ if (v == null) delete S.inputs[id]; else S.inputs[id] = v; S.selectedId = null; save(); updateMatch(); }
function syncSlider(id, v){

function inputCard(p){

function updateMatch(){
  const {res, act} = rank();
  S.parameters.forEach(p => {
    if (isBool(p)) return;
    const v = S.inputs[p.id], h = view.querySelector(`[data-hint="${p.id}"]`), sp = sliderSpec(p);
    const out = v != null && ((p.min != null && v < p.min) || (p.max != null && v > p.max));
    if (h) {
      h.className = 'xsmall ' + (out ? 'warn-text' : 'muted');
      h.textContent = out ? `Outside allowable ${fmt(p.min)} – ${fmt(p.max)}` : `${sp.src}: ${fmt(sp.rlo)} – ${fmt(sp.rhi)}`;
    }
  });
  const anyRel = res.some(r => r.n > 0);
  const box = $('#result');
  const shown = act.length && anyRel ? (res.find(r => r.pr.id === S.selectedId) || res[0]) : null;
  if (!act.length) {

  } else if (!anyRel) {
    box.innerHTML = `<div class="card empty muted">None of the entered parameters are marked relevant for any product. Review relevance on the Products tab.</div>`;
  } else {
    const isBest = shown === res[0];
    const C = 2 * Math.PI * 64, col = shown.score >= 95 ? 'var(--good)' : shown.score >= 60 ? 'var(--warn)' : 'var(--bad)';
    const fits = act.map(p => fitRow(p, shown.fits[p.id])).join('');
    const notRel = act.length - shown.n;
    const alts = res.filter(r => r !== shown).slice(0, 3).map(r => `<button data-pick="${r.pr.id}">${esc(r.pr.name)} · ${Math.round(r.score)}%</button>`).join('');
    box.innerHTML = `<div class="card">
      <div class="result-top">
        <div class="ring"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="var(--soft)" stroke-width="13"/>
          <circle cx="75" cy="75" r="64" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - shown.score / 100)}" style="transition:stroke-dashoffset .4s"/></svg>
          <div class="v"><b>${Math.round(shown.score)}%</b><span class="xsmall muted">match score</span></div></div>
        <div class="summary"><div class="tag">${isBest ? 'BEST MATCH' : 'SELECTED PRODUCT'}</div>
          <div class="pname">${esc(shown.pr.name)}</div>

      </div>

    </div>`;
    box.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { S.selectedId = b.dataset.pick; save(); updateMatch(); });
  }
  const scored = act.length && anyRel;
  $('#listTitle .ttl').textContent = scored ? 'All Products – Ranked by Match' : 'All Products';
  $('#list').innerHTML = res.map((r, i) => {
    const sc = r.score >= 95 ? 'var(--good)' : r.score >= 60 ? 'var(--warn)' : 'var(--bad)';
    const chips = S.parameters.map(p => {
      const rel = wOf(r.pr, p) > 0, f = r.fits[p.id];
      let val;
      if (!rel) val = 'N/A';
      else if (isBool(p)) val = r.pr.flags[p.id] ? BL[r.pr.flags[p.id]] : '—';
      else { const rr = rng(r.pr, p); val = rr ? fmt(rr[0]) + '–' + fmt(rr[1]) : '—'; }
      return `<div class="chip ${!rel ? 'na' : f ? f.st : ''}"><span class="muted">${esc(p.name)}</span><b>${val}</b></div>`;
    }).join('');
    return `<div class="card item ${scored && r === shown ? 'sel' : ''}" data-row="${r.pr.id}">
      <div class="rank">${scored ? `<div class="badge ${i === 0 ? 'first' : ''}">${i + 1}</div>` : ''}
        <div style="flex:1;min-width:0"><b>${esc(r.pr.name)}</b>${r.pr.notes ? `<div class="xsmall muted clamp">${esc(r.pr.notes)}</div>` : ''}</div>

  });
}
function fitRow(p, f){
  const st = f.excluded ? 'excluded' : f.st;
  const wl = f.excluded ? 'Not relevant' : `Weight: ${f.w}`;
  if (isBool(p)) {
    const txt = f.excluded ? 'Not relevant' : f.st === 'within' ? 'Matches' : f.st === 'missing' ? 'No data' : 'Does not match';
    return `<div class="fit"><div class="row"><b class="small">${esc(p.name)}</b>
      <span class="xsmall muted">Input ${BL[f.v]} · Product ${f.r ? BL[f.r] : '—'} · ${wl}</span>
      <span class="st c-${st}">${txt}</span></div></div>`;
  }
  const txt = f.excluded ? 'Not relevant' : f.st === 'within' ? 'Within range' : f.st === 'missing' ? 'No data'
    : (f.d < 0 ? 'Below by ' : 'Above by ') + fmt(Math.abs(f.d)) + (p.unit ? ' ' + p.unit : '');
  const sp = sliderSpec(p), e = productExtent(p);
  let lo = Math.min(sp.lo, e ? e[0] : sp.lo, f.v), hi = Math.max(sp.hi, e ? e[1] : sp.hi, f.v);
  if (hi <= lo) hi = lo + 1;
  const pad = (hi - lo) * 0.04; lo -= pad; hi += pad;
  const pos = x => ((x - lo) / (hi - lo) * 100).toFixed(2);
  const band = f.r && !f.excluded ? `<div class="band" style="left:${pos(f.r[0])}%;width:${Math.max(pos(f.r[1]) - pos(f.r[0]), 1.5)}%"></div>` : '';
  return `<div class="fit"><div class="row"><b class="small">${esc(p.name)}</b>
    <span class="xsmall muted">${f.r && !f.excluded ? fmt(f.r[0]) + '–' + fmt(f.r[1]) + ' ' + esc(p.unit) + ' · ' : ''}${wl}</span>
    <span class="st c-${st}">${esc(txt)}</span></div>
    <div class="track">${band}<div class="marker b-${st}" style="left:${pos(f.v)}%"></div></div></div>`;
}

/* ======================= PARAMETERS TAB ======================= */
function renderParams(){
  const n = S.parameters.length;
  const cards = n ? S.parameters.map((p, i) => listCard(p.id, i, n, p.name, '', false, p.details,
      chip('Type', esc(TYPES[p.type].label.split(' ')[0])) +
      (isBool(p) ? chip('Values', 'Yes / No') : chip('Allowable', `${fmt(limits(p)[0])} – ${fmt(limits(p)[1])}${p.unit ? ' ' + esc(p.unit) : ''}`)) +
      chip('Weight', p.weight))).join('')
    : `<div class="card muted small">No parameters yet. Select <b>+ Add</b> to define each parameter's name, type, allowable range, weight and description.</div>`;
  view.innerHTML = section('params', 'Parameters', '<button class="btn primary" id="addP">+ Add</button>',
      `${n ? '<p class="listnote">Tap a card to edit. ▲ ▼ reorder; the order is used on the Match tab and in the product editor.</p>' : ''}${cards}
       <p class="listnote">Weight (0–10) is the default for every product. On the Products tab each parameter can be marked not relevant (weight 0) or given its own weight for that product.</p>`) +
    (n ? `<button class="btn primary block" data-go="products">Next: enter products →</button>` : '');
  $('#addP').onclick = () => editParam(null);
  view.onclick = e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const id = t.dataset.id, i = S.parameters.findIndex(p => p.id === id), act = t.dataset.act;
    if (act === 'edit') return editParam(id);
    if (act === 'up' || act === 'down') return moveItem(S.parameters, i, act === 'up' ? -1 : 1, id);
    if (act === 'dup') {
      const src = S.parameters[i], c = JSON.parse(JSON.stringify(src)); c.id = uid('p');
      let nm = src.name + ' (copy)', k = 2;
      while (S.parameters.some(x => x.name.toLowerCase() === nm.toLowerCase())) nm = `${src.name} (copy ${k++})`;
      c.name = nm; S.parameters.splice(i + 1, 0, c);
      S.products.forEach(pr => {
        if (pr.ranges[src.id]) pr.ranges[c.id] = [...pr.ranges[src.id]];
        if (pr.flags[src.id]) pr.flags[c.id] = pr.flags[src.id];
        if (pr.rel[src.id]) pr.rel[c.id] = {...pr.rel[src.id]};
      });
      save(); return afterSave(c.id, true);
    }
    if (act === 'del') {
      if (!confirm(`Delete "${S.parameters[i].name}"? Its values will be removed from all products.`)) return;
      const snap = snapshot();
      S.parameters.splice(i, 1);
      S.products.forEach(pr => { delete pr.ranges[id]; delete pr.flags[id]; delete pr.rel[id]; });

    }

}
function editParam(id){

/* ======================= CSV ======================= */
// [PARAMETERS] Name, Type, Unit, Range Min, Range Max, Weight, Description
//   Type: cm | % | Y/N   (Number accepted for older files)
// [PRODUCTS]   Product, Notes, then per parameter:
//   numeric: "<Name> Lower", "<Name> Upper";  Yes/No: "<Name> Value" (Yes / No / Either)
//   and "<Name> Weight" (0 = not relevant; blank = parameter default)
const TYPE_CSV = {number: 'Number', cm: 'cm', percent: '%', boolean: 'Y/N'};
function parseType(t, unit){
  const l = String(t || '').toLowerCase(), u = String(unit || '').trim().toLowerCase();
  if (l.includes('yes') || l.includes('bool') || l.includes('y/n')) return 'boolean';
  if (l.includes('percent') || l.includes('%')) return 'percent';
  if (l.includes('cm') || l.includes('length')) return 'cm';
  if (!l) { if (u === 'cm') return 'cm'; if (u === '%') return 'percent'; }
  return 'number';
}
const cell = v => { v = String(v ?? ''); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function toCSV(){
  const rows = [['[SETTINGS]'], ['Title', S.title], [], ['[PARAMETERS]'], ['Name', 'Type', 'Unit', 'Range Min', 'Range Max', 'Weight', 'Description']];
  S.parameters.forEach(p => rows.push([p.name, TYPE_CSV[p.type], p.unit, plain(p.min), plain(p.max), plain(p.weight), p.details]));
  rows.push([], ['[PRODUCTS]']);
  const h = ['Product', 'Description'];
  S.parameters.forEach(p => { if (isBool(p)) h.push(p.name + ' Value'); else h.push(p.name + ' Lower', p.name + ' Upper'); h.push(p.name + ' Weight'); });
  rows.push(h);
  S.products.forEach(pr => {
    const r = [pr.name, pr.notes];
    S.parameters.forEach(p => {
      if (isBool(p)) r.push(pr.flags[p.id] ? BL[pr.flags[p.id]] : '');
      else { const v = pr.ranges[p.id] || [null, null]; r.push(plain(v[0]), plain(v[1])); }
      r.push(plain(wOf(pr, p)));
    });
    rows.push(r);
  });
  return rows.map(r => r.map(cell).join(',')).join('\r\n') + '\r\n';
}
function parseRows(t){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r' && c !== '﻿') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function splitBound(h){
  const sfx = [[' minimum', 0], [' maximum', 1], [' weight', 'w'], [' lower', 0], [' upper', 1], [' value', 'v'], [' min', 0], [' max', 1], [' low', 0], [' high', 1]];
  const l = h.toLowerCase();
  for (const [s, k] of sfx) if (l.endsWith(s)) { const b = h.slice(0, -s.length).trim(); if (b) return [b, k]; }
  return null;
}
function fromCSV(text){
  const rows = parseRows(text), out = {title: '', parameters: [], products: []}, notes = [];
  let section = '', pHead = null, cols = null, nameIdx = 0, notesIdx = -1, adjusted = 0;
  const findP = name => out.parameters.find(x => x.name.toLowerCase() === name.toLowerCase());
  for (const row of rows) {
    if (row.every(x => !x.trim())) continue;
    const first = (row[0] || '').trim();
    if (/^\[.*\]$/.test(first)) { section = first.toUpperCase(); pHead = null; cols = null; continue; }
    if (section === '[SETTINGS]') { if (first.toLowerCase() === 'title' && row.length > 1) out.title = row[1].trim(); }
    else if (section === '[PARAMETERS]') {
      if (!pHead) { pHead = {}; row.forEach((h, i) => pHead[h.trim().toLowerCase()] = i); continue; }
      const col = keys => { for (const k of keys) if (pHead[k] != null && pHead[k] < row.length) return row[pHead[k]]; return undefined; };
      const name = (col(['name', 'parameter']) || '').trim();
      if (!name) continue;
      if (findP(name)) { notes.push(`Duplicate parameter "${name}" was ignored.`); continue; }
      const unit = (col(['unit', 'units']) || '').trim(), type = parseType(col(['type']), unit), probe = {type};
      let w = num(col(['weight']));
      w = w == null ? 5 : Math.max(0, Math.min(10, Math.round(w)));
      out.parameters.push({id: uid('p'), name, type, unit: type === 'boolean' ? '' : (TYPES[type].unit || unit),
        min: type === 'boolean' ? null : roundP(probe, num(col(['range min', 'min', 'minimum']))),
        max: type === 'boolean' ? null : roundP(probe, num(col(['range max', 'max', 'maximum']))),
        weight: w, details: (col(['description', 'details']) || '').trim()});
    }
    else if (section === '[PRODUCTS]') {
      if (!cols) {
        cols = []; nameIdx = 0; notesIdx = -1;
        row.forEach((raw, i) => {
          const h = raw.trim(), l = h.toLowerCase();
          if (['product', 'name', 'model'].includes(l)) nameIdx = i;
          else if (['notes', 'note', 'description'].includes(l)) notesIdx = i;
          else { const b = splitBound(h); if (b) {
            let p = findP(b[0]);
            if (!p) {
              p = {id: uid('p'), name: b[0], type: b[1] === 'v' ? 'boolean' : 'number', unit: '', min: null, max: null, weight: 5, details: ''};
              out.parameters.push(p);
              notes.push(`Parameter "${b[0]}" was found only in the product columns and was added with default settings.`);
            }
            cols.push([i, p, b[1]]);
          } }
        });
        continue;
      }
      const name = (row[nameIdx] || '').trim();
      if (!name) continue;
      const pr = {id: uid('r'), name, notes: notesIdx >= 0 ? (row[notesIdx] || '').trim() : '', ranges: {}, flags: {}, rel: {}};
      cols.forEach(([i, p, k]) => {
        const c = row[i];
        if (k === 'w') { const n = num(c); if (n != null) pr.rel[p.id] = n > 0 ? {on: true, w: Math.min(10, n)} : {on: false, w: null}; }
        else if (k === 'v') { if (isBool(p)) { const b = parseBool(c); if (b) pr.flags[p.id] = b; } }
        else if (!isBool(p)) { const r = pr.ranges[p.id] || [null, null], raw = num(c); r[k] = conformValue(p, raw); if (raw != null && r[k] !== raw) adjusted++; pr.ranges[p.id] = r; }
      });
      out.products.push(pr);
    }
  }
  if (adjusted) notes.push(`${adjusted} product value(s) were adjusted to match their parameter's resolution and range.`);
  if (!out.parameters.length) throw new Error('No parameters were found. The file needs a [PARAMETERS] section with a header row (Name, Type, Unit, Range Min, Range Max, Weight, Description).');
  return {data: out, notes};
}
$('#fileIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const {data, notes} = fromCSV(await f.text());
    if ((S.parameters.length || S.products.length) &&
        !confirm(`Replace current settings with ${data.parameters.length} parameters and ${data.products.length} products from ${f.name}?`)) return;
    S.title = data.title || S.title; S.parameters = data.parameters; S.products = data.products; S.inputs = {}; S.selectedId = null;
    fix(S); save(); setTab('data');
    alert(`Imported ${data.parameters.length} parameters and ${data.products.length} products.` + (notes.length ? '\n\n' + notes.join('\n') : ''));
  } catch (err) { alert('Import failed: ' + err.message); }
};
async function exportCSV(){
  const name = `ProductMatch-Settings-${localDate()}.csv`;
  const file = new File(['﻿' + toCSV()], name, {type: 'text/csv'});
  const done = () => { S.lastExport = Date.now(); save(); if (S.tab === 'data') renderData(); };
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file], title: name}); done(); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  done(); toast('Exported ' + name);
}

  const params = defs.map(d => ({id: uid('p'), name: d[0], type: d[1], unit: TYPES[d[1]].unit || '', min: d[2], max: d[3], weight: d[4], details: d[5]}));
  const rows = [['Product A', 'Example only', [2, 10.5], [0, 50], 'no', {}], ['Product B', 'Example only', [5, 20], [25, 100], 'either', {}],
    ['Product C', 'Example only', [1, 15], [0, 75], 'yes', {2: {on: false, w: null}, 0: {on: true, w: 3}}]];
  const products = rows.map(r => {
    const rel = {}; Object.entries(r[5]).forEach(([i, v]) => rel[params[i].id] = v);
    return {id: uid('r'), name: r[0], notes: r[1], ranges: {[params[0].id]: r[2], [params[1].id]: r[3]}, flags: {[params[2].id]: r[4]}, rel};
  });
  return {title: 'Example Selector', parameters: params, products, inputs: {}, tab: null, selectedId: null, lastExport: null};
}

save();
setTab(S.tab || (configured() ? 'match' : 'params'));

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
