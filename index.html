<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Product Match">
<meta name="theme-color" content="#0f2f5e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" href="icons/icon-192.png?v=2">
<title>Product Match</title>
<style>
:root{--bg:#f2f3f7;--card:#fff;--ink:#141c28;--muted:#6b7686;--line:#e3e7ee;--accent:#1f5fbf;--teal:#0d9488;--good:#16a34a;--warn:#d97706;--bad:#dc2626;--gray:#9aa3af;--band:rgba(31,95,191,.32);--soft:#f6f8fb}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#171d27;--ink:#e7ecf3;--muted:#98a3b3;--line:#283140;--accent:#5b9bff;--band:rgba(91,155,255,.38);--soft:#1e2532}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif}
body.locked{overflow:hidden}
header.top{background:linear-gradient(125deg,#0f2f5e,#1f5fbf 60%,#0ea5a4);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 18px}
header.top h1{margin:0;font-size:22px;font-weight:700}
header.top .sub{opacity:.85;font-size:13px;margin-top:2px}
main{max-width:980px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 40px)}
section{margin-bottom:18px}
h2{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:6px 4px 8px;font-weight:600}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line);margin-bottom:10px}
.row{display:flex;align-items:baseline;gap:8px}
.spacer{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}.xsmall{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.grid .card{margin:0}
input,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-size:17px}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent);height:30px}
.inp input[type=number]{margin:8px 0 4px;font-size:20px;font-weight:600}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wt{font-weight:600;color:var(--muted);white-space:nowrap;text-align:right}
.vslider{width:100%;margin-top:8px}
.vslider.unset{opacity:.45}
select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-size:17px}
.inp select{margin:8px 0 4px;font-size:20px;font-weight:600}
.pfield{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;padding:0;accent-color:var(--accent);flex:none}
.wbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.wbox input{width:62px;padding:6px 8px;font-size:16px;text-align:center}
.pbody{margin-top:10px}
.pfield.off .pbody,.pfield.off .wbox{display:none}
.pfield .offnote{display:none;margin-top:6px}
.pfield.off .offnote{display:block}
.chip.na b{color:var(--gray)}
/* header Settings button */
.hwrap{display:flex;align-items:center;gap:12px;max-width:980px;margin:0 auto}
.htext{flex:1;min-width:0}
.gear{flex:none;min-width:44px;height:44px;padding:0 12px;border-radius:12px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;font:inherit;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
.gear svg{width:24px;height:24px}
.hwrap{gap:10px}
.hreset{margin-left:auto}
.gear{position:relative}
.gear .devb{position:absolute;right:-6px;bottom:-6px;font:700 10px/1 ui-monospace,Menlo,monospace;background:#f59e0b;color:#111;border-radius:6px;padding:3px 4px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.gear.wiggle{animation:shake .5s ease 2}
.gear,body.dev #view{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.chip.hlq,.fit.hlq{border-radius:10px}
/* compact Match cards */
.grid{gap:8px}
.inp{padding:10px 12px}
.inp .top{display:flex;align-items:baseline;gap:8px}
.inp .top b{font-size:15px}
.inp .vslider{margin:4px 0 0}
.ends{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--muted);margin-top:-2px}
.ends .val{font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.ends .val.warn-text{color:var(--warn)}
.bot{display:flex;align-items:center;gap:8px;margin-top:4px;min-height:26px}
.yn{display:flex;gap:8px;margin:8px 0 2px}
.rb{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-weight:600;cursor:pointer}
.rb input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.rb .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--gray);background:var(--card);flex:none;transition:all .15s}
.rb.on{border-color:var(--accent);background:var(--accent);color:#fff}
.rb.on .dot{border-color:#fff;background:var(--accent);box-shadow:inset 0 0 0 4px #fff}
.inp.pending .rb.on{opacity:.6}
.inp.noslider .ends{margin-bottom:4px}
/* chips scroll together as columns */
.vstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:4px 0 0;padding:2px 0;scroll-snap-type:x proximity}
.vstrip::-webkit-scrollbar{display:none}
.vchip{flex:none;min-width:52px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--muted);font:inherit;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;scroll-snap-align:center}
.vchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ring .v{text-align:center}
.inp{position:relative}
.valin{width:132px;text-align:center;border:1px solid transparent;background:transparent;font:inherit;font-size:18px;font-weight:700;color:var(--ink);padding:3px 8px;border-radius:8px;font-variant-numeric:tabular-nums;cursor:text}
.valin::placeholder{color:var(--muted);font-weight:600}
.valin:focus{background:var(--soft);border-color:var(--accent);outline:none}
.valin.warn-text{color:var(--warn)}
.ends{align-items:center}
.inp .desc{max-width:100%}
.valwrap{display:inline-flex;align-items:baseline;gap:2px}
.valwrap .unit{font-size:14px;font-weight:600;color:var(--muted)}
.ends .unit{color:inherit}
.valin{width:4ch;min-width:3ch;max-width:60vw;text-align:center;padding:3px 4px}
.valin:focus{min-width:7ch}
.vrowx{display:flex;align-items:center;gap:8px}
.vrowx .vstrip{flex:1;min-width:0}
/* not yet entered (e.g. defaults after Reset): shown faded and not scored */
.inp.pending .valin,.inp.pending .vchip.on{opacity:.55}
.lpanel{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px;border-radius:14px;box-shadow:inset 0 -10px 10px -10px rgba(0,0,0,.25)}
/* Input Parameters as a two-tile sliding pane while All Products is open */
.grid.pane{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-snap-type:y proximity;border-radius:14px;box-shadow:inset 0 -10px 10px -10px rgba(0,0,0,.25)}
.grid.pane>.inp{scroll-snap-align:start}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-9px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes badflash{0%,35%{background:color-mix(in srgb,var(--bad) 16%,var(--card));border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}100%{}}
.inp.bad{animation:shake .45s ease,badflash 1.3s ease}
.inp .vslider{margin:8px 0 0}
.inp .bot{margin:2px 0 4px}
.linkbtn{display:inline-block;margin-top:10px;text-decoration:none}
.scol{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.srow{display:flex;align-items:center;gap:10px}
.sctx{font-size:11px;color:var(--muted);white-space:nowrap}
/* no text selection except in entry fields */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.vrow{grid-template-columns:34px minmax(0,1fr) auto;padding:8px 10px;margin-bottom:6px;align-items:center}
.vrow .mv button{width:34px;height:30px;font-size:12px}
.vrow .acts{gap:4px}
.vrow .acts button{padding:5px 8px;font-size:12px}
.vbody{display:flex;align-items:center;gap:8px}
.rline{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.rline select{flex:0 1 112px;min-width:84px}
#stepBox{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0}
#stepBox input{flex:1;min-width:64px}
.rline .small{white-space:nowrap;color:var(--muted);font-weight:600}
.switch,.field label.switch{display:flex;align-items:center;gap:10px;margin:10px 2px 0;cursor:pointer;font-size:15px;font-weight:500;color:var(--ink)}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sw{display:block;flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked + .sw{background:var(--good)}
.switch input:checked + .sw::after{transform:translateX(18px)}
.switch input:focus-visible + .sw{outline:2px solid var(--accent)}
input:disabled,select:disabled,textarea:disabled{background:var(--line);color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:1;cursor:not-allowed}
input.bad,select.bad{animation:shake .45s ease,badflash 1.3s ease}
.vbody input{font-size:17px;padding:8px 10px}
.vnum{flex:none;min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.prow{display:flex;align-items:center;gap:8px}
.relcb{width:22px;height:22px;margin:0;padding:0;flex:none;accent-color:var(--accent)}
.ptoggle{flex:1;min-width:0;display:flex;align-items:center;gap:4px;background:none;border:0;padding:4px 0;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.pname2{min-width:0;overflow-wrap:anywhere}
.psum{display:none;margin:4px 0 0 30px}
.pfield.collapsed .pbody{display:none}
.pfield.collapsed:not(.off) .psum{display:block}
.pfield.collapsed .caret{transform:rotate(-90deg)}
.chips.sync .chip{width:112px;flex:none;overflow:hidden}
.chips.sync .chip span,.chips.sync .chip b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Settings accordion */
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-bottom:10px}
.acc-h{min-height:48px;cursor:pointer}
.acc-h h2{margin:0;font-size:15px;letter-spacing:.3px;color:var(--ink);display:flex;align-items:center;gap:6px}
.acc:not(.open) .caret{transform:rotate(-90deg)}
.acc-body{padding:4px 0 10px}
.acc-body:empty{display:none}
.subh{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:14px 4px 6px;font-weight:600}
details.en summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);margin:0 2px 6px;list-style:none}
details.en summary::-webkit-details-marker{display:none}
details.en summary::before{content:"▾";display:inline-block;width:14px;transition:transform .2s}
details.en:not([open]) summary::before{transform:rotate(-90deg)}
/* uniform list cards: ▲▼ left, content middle, Duplicate / Delete right */
.lcard{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:stretch}
.mv,.acts{display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.mv button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:15px;cursor:pointer}
.ltitle{display:block;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.acts button{font:inherit;font-size:12px;padding:8px 9px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;white-space:nowrap}
.acts .danger{color:var(--bad)}
.mv button:disabled{opacity:.3}
.lbody{cursor:pointer;min-width:0}
.lcard.incomplete{background:color-mix(in srgb,var(--warn) 13%,var(--card));border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.pfield.missing{background:color-mix(in srgb,var(--warn) 13%,var(--card));border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.enrow{padding:8px 0;border-top:1px solid var(--line)}
.listnote{font-size:12px;color:var(--muted);margin:2px 4px 10px}
/* collapsible sections */
h2.ctl{cursor:pointer;user-select:none;-webkit-user-select:none;display:flex;align-items:center}
.caret{display:inline-block;width:14px;transition:transform .2s ease;margin-right:4px}
section.collapsed .caret{transform:rotate(-90deg)}
section.collapsed .sec-body{display:none}
/* effects */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
main.anim>*{animation:fadeUp .25s ease both}
main.anim>*:nth-child(2){animation-delay:.04s}main.anim>*:nth-child(3){animation-delay:.08s}main.anim>*:nth-child(4){animation-delay:.12s}
.sheet:not(.hidden){animation:fadeIn .2s ease}
.sheet:not(.hidden) .sheet-card{animation:slideUp .28s cubic-bezier(.2,.8,.2,1)}
.flash{animation:flash 1s ease}
button{transition:transform .08s ease}
button:active:not(:disabled){transform:scale(.96)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--accent);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.block{display:block;width:100%;margin-top:6px}
.btn:disabled{opacity:.4}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:4px}
.pill{font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.item{cursor:pointer}
.item-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.item-actions button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:5px 11px}
.item-actions .danger{color:var(--bad)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:8px;padding:4px 8px;background:var(--soft);font-size:12px;line-height:1.25}
.chip b{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.chip.within{background:color-mix(in srgb,var(--good) 18%,transparent)}
.chip.near{background:color-mix(in srgb,var(--warn) 18%,transparent)}
.chip.far{background:color-mix(in srgb,var(--bad) 15%,transparent)}
.result-top{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex:none;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-size:36px;line-height:1}
/* compact top tile on phones: ring beside the product details */
@media (max-width:520px){
  .rhead .result-top{flex-wrap:nowrap;gap:14px;align-items:flex-start}
  .rhead .ring{width:104px;height:104px;margin:0}
  .rhead .ring svg{width:104px;height:104px}
  .rhead .ring .v b{font-size:24px}
  .rhead .ring .v .xsmall{font-size:10px}
  .rhead .summary{min-width:0;flex:1}
  .rhead .pname{font-size:18px}
}
.tag{font-size:11px;font-weight:700;letter-spacing:.7px;color:var(--teal)}
.pname{font-size:24px;font-weight:700;margin:2px 0}
.summary{flex:1;min-width:220px}
.fit{padding:10px 0;border-top:1px solid var(--line)}
.fit .row{flex-wrap:wrap}
.track{position:relative;height:12px;background:var(--soft);border:1px solid var(--line);border-radius:6px;margin-top:8px}
.band{position:absolute;top:1px;bottom:1px;background:var(--band);border-radius:5px}
.marker{position:absolute;top:-6px;width:4px;height:22px;margin-left:-2px;border-radius:2px}
.st{font-weight:600;font-size:14px;margin-left:auto}
.c-within{color:var(--good)}.c-near{color:var(--warn)}.c-far{color:var(--bad)}.c-missing,.c-excluded{color:var(--gray)}
.b-within{background:var(--good)}.b-near{background:var(--warn)}.b-far{background:var(--bad)}.b-missing,.b-excluded{background:var(--gray)}
.alts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
#result .card.rhead{margin-bottom:10px}
[data-section="m-result"] .sec-body{overflow-x:hidden}
.sec-body.vpane{scrollbar-width:none}.sec-body.vpane::-webkit-scrollbar{display:none}
.alts button{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:6px 12px}
.rank{display:flex;align-items:center;gap:12px}
.badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--soft);flex:none;font-variant-numeric:tabular-nums}
.badge.first{background:var(--accent);color:#fff}
.sbar{width:80px;height:8px;border-radius:4px;background:var(--soft);overflow:hidden;flex:none}
.sbar i{display:block;height:100%}
.pct{font-weight:700;width:46px;text-align:right;font-variant-numeric:tabular-nums}
.sel{outline:2px solid var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.empty{text-align:center;padding:28px 12px}
.empty .big{font-size:40px}
.warn-text{color:var(--warn)}.err-text{color:var(--bad)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 2px 5px}
.pair{display:flex;gap:8px;align-items:center}
.pair span{color:var(--muted)}
.issue{font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.issue:first-child{border-top:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-card{background:var(--bg);width:100%;max-width:640px;height:calc(100% - env(safe-area-inset-top) - 12px);max-height:100%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.sheet-head b{font-size:16px}
.sheet-body{flex:1;overflow-y:auto;padding:16px 14px calc(env(safe-area-inset-bottom) + 30px);-webkit-overflow-scrolling:touch}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#141c28;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1}
/* Result and All Products shown as two scrolling halves */
#result.rpanel{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px;border-radius:14px;box-shadow:inset 0 -10px 10px -10px rgba(0,0,0,.25)}
#result.rpanel>.card{margin-bottom:2px}
/* flagged field: persistent highlight with a floating comment (tap the comment to accept) */
:root{--flag:#b45309}
@media (prefers-color-scheme:dark){:root{--flag:#c2570c}}
.fhost{position:relative}
.fhosting{z-index:30}
.flagged{box-shadow:0 0 0 2px var(--flag)!important;background-color:color-mix(in srgb,var(--flag) 13%,var(--card))!important;border-radius:10px}
.flagged.bad{animation:shake .45s ease}
.inp.flagged{border-radius:14px}
.fbub{position:absolute;z-index:40;width:max-content;max-width:min(290px,100%);padding:8px 11px;border-radius:10px;border:0;background:var(--flag);color:#fff;font:inherit;font-size:12.5px;font-weight:600;line-height:1.3;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer;animation:fadeIn .2s ease;-webkit-user-select:none;user-select:none}
.fbub::before{content:"";position:absolute;top:-5px;left:var(--ax,24px);width:11px;height:11px;background:var(--flag);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.fbub .fd{display:block;font-weight:500;opacity:.92;margin-top:3px}
.fbub .fa{display:block;margin-top:5px;text-decoration:underline}
/* description detail: Normal (full), Advanced (two lines), Expert (hidden) */
.dtext{white-space:pre-line;overflow-wrap:anywhere}
.inp .dtext{margin:3px 0 4px}
/* list cards: side buttons aligned to the top of the tile; parameter chips wrap */
.lcard>.mv,.lcard>.acts{justify-content:flex-start}
.lcard{grid-template-columns:auto minmax(0,1fr) auto}
.lcard>.mv button{font:inherit;font-size:13px;width:auto;min-width:36px;height:35px;padding:0 4px;border-radius:8px}
.lsubs{grid-column:1/-1;margin-top:2px;display:flex;flex-direction:column;gap:8px}
.lsubs .lcard{margin:0;background:color-mix(in srgb,var(--accent) 3%,var(--card));border-left:3px solid color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:none}
.lsubs .lcard .lbody{min-width:0}
.ccond{font-size:12px;font-weight:600;color:color-mix(in srgb,var(--accent) 70%,var(--card));margin-top:2px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips.wrap .chip{max-width:100%}
.chips.wrap .chip b{overflow-wrap:anywhere}
[data-field]{cursor:pointer}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);transition:opacity .35s ease}
#splash img{width:132px;height:132px;border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.18);background:#fff}
#splash h1{margin:0;font-size:26px;color:var(--ink);text-align:center;padding:0 20px}
#splash.hide{opacity:0;pointer-events:none}
/* profile menu from the title */
#title{cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#title .tcaret{font-size:.6em;opacity:.85}
#pmenu{position:fixed;z-index:60;min-width:220px;max-width:calc(100% - 32px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.3);padding:6px;animation:fadeIn .15s ease}
#pmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:15px;background:none;border:0;border-radius:9px;padding:10px 12px;color:var(--ink);cursor:pointer}
#pmenu button:active,#pmenu button.cur{background:var(--soft)}
#pmenu .ck{width:16px;color:var(--accent);font-weight:700}
#pmenu .pm-sub{font-size:12px;color:var(--muted);margin-left:auto}
#pmenu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
/* Match panes */
.sec-body.vpane{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:auto;border-radius:14px;padding:2px 2px 8px}
section.collapsed .sec-body.vpane{display:none}
section.collapsed .splitbar{display:none!important}
.splitbar{position:relative;height:40px;margin:0 0 2px;display:flex;align-items:center;justify-content:center;cursor:row-resize;touch-action:none;-webkit-user-select:none;user-select:none}
.splitbar .grip{width:56px;height:5px;border-radius:3px;background:var(--line)}
.splitbar.drag .grip{background:var(--accent);width:90px}
.splitbar.drag::after{content:attr(data-h);position:absolute;left:12px;font-size:11px;font-weight:700;color:var(--accent)}
.splitbar .grip{pointer-events:none}
.splitbar.locked{cursor:default}.splitbar.locked .grip{opacity:.4}
/* scroll-pane and lock buttons: same outline icon; dashed border = off / unlocked, solid border = on / locked */
.panebtn,.lockbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:30px;padding:0;cursor:pointer;
  color:var(--accent)!important;background:var(--card)!important;border:1.5px dashed var(--accent)!important;border-radius:999px}
.panebtn{margin-left:8px}
.panebtn svg{width:24px;height:24px}.lockbtn svg{width:18px;height:18px}
.panebtn .pb{fill:none;stroke:none}.panebtn .pg{stroke:currentColor}
.lockbtn svg{fill:none!important;stroke:currentColor!important;stroke-width:2}
.panebtn.on,.splitbar.locked .lockbtn{border-style:solid!important;border-width:2px!important}
.panebtn.on .pg,.splitbar.locked .lockbtn svg{stroke-width:2.4}
/* locks: style 1 green/red, 2 gray/solid, 3 distinct (label) */
.lockbtn{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:11.5px}
.lockbtn svg{width:16px;height:16px}
.lockbtn .lt{display:none}
body[data-lockstyle="1"] .lockbtn{color:#15803d;border-color:#15803d}
body[data-lockstyle="1"] .lockbtn svg{fill:none;stroke:currentColor;stroke-width:2}
body[data-lockstyle="1"] .locked .lockbtn{color:#fff;background:#dc2626;border-color:#dc2626}
body[data-lockstyle="1"] .locked .lockbtn svg{fill:#fff;stroke:#fff}
body[data-lockstyle="2"] .lockbtn{color:var(--muted);background:var(--card);border-color:var(--line)}
body[data-lockstyle="2"] .lockbtn svg{fill:none;stroke:currentColor;stroke-width:2}
body[data-lockstyle="2"] .locked .lockbtn{color:#fff;background:var(--ink);border-color:var(--ink)}
body[data-lockstyle="2"] .locked .lockbtn svg{fill:#fff;stroke:#fff}
body[data-lockstyle="3"] .lockbtn{color:var(--accent);background:var(--card);border:1.5px dashed var(--accent);padding:4px 9px}
body[data-lockstyle="3"] .lockbtn svg{fill:none;stroke:currentColor;stroke-width:2}
body[data-lockstyle="3"] .lockbtn .lt{display:inline}
body[data-lockstyle="3"] .locked .lockbtn{color:#fff;background:var(--accent);border:1.5px solid var(--accent)}
body[data-lockstyle="3"] .locked .lockbtn svg{fill:#fff;stroke:#fff}
body[data-lockstyle="3"] .splitbar.locked .grip{background:var(--accent);opacity:1;height:3px}
.lockbtn{position:absolute;right:2px;top:50%;transform:translateY(-50%);border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:12px;line-height:1;padding:4px 8px;cursor:pointer}
/* info (description) and graduation-cap (reasoning) icons beside titles */
.ibtn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;margin-left:4px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--accent);cursor:pointer;vertical-align:middle}
.ibtn svg{width:19px;height:19px}
.ibtn:active{background:var(--soft)}
.tline{display:flex;align-items:center;flex-wrap:wrap;gap:0}
.ibtn.xbtn{color:var(--bad)}
.dlg-card p .xwarn{margin-top:0}
.pname .ibtn{width:30px;height:30px}.pname .ibtn svg{width:22px;height:22px}
/* brief highlight that fades out */
@keyframes hlfade{0%,55%{box-shadow:0 0 0 2px var(--flag);background-color:color-mix(in srgb,var(--flag) 13%,var(--card))}}
.hl{animation:shake .45s ease,hlfade 2.6s ease}
.hlq{animation:hlfade 2.6s ease}
.dlg-card p{white-space:pre-line}
@keyframes notefade{0%{opacity:0}8%,78%{opacity:1}100%{opacity:0}}
.fbub.note{pointer-events:none;animation:notefade 3.3s ease forwards}
/* in-app confirmation */
.dlg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .18s ease}
.dlg.hidden{display:none}
.dlg-card{background:var(--card);color:var(--ink);border-radius:16px;padding:18px 18px 14px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:dlgIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes dlgIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.dlg-card b{font-size:17px}
.dlg-card p{margin:8px 0 16px;font-size:15px;color:var(--muted);line-height:1.4}
.dlg-acts{display:flex;gap:10px}.dlg-acts .btn{flex:1;padding-left:8px;padding-right:8px}
/* products that should not be used together */
.xchips{display:flex;flex-wrap:wrap;gap:6px}
.xchip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.xchip.on{background:color-mix(in srgb,var(--bad) 14%,var(--card));border-color:var(--bad);color:var(--bad);font-weight:700}
.xwarn{margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card));color:var(--bad);font-size:13px;font-weight:600}
.xwarn .xn{display:block;font-weight:400;color:var(--ink);margin-top:3px}
.card.item.xconf{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--card))}
.xtag{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:700;color:#fff;background:var(--bad);border-radius:6px;padding:2px 7px}
.xico{color:var(--bad);font-weight:700;font-size:12px;margin-left:6px;white-space:nowrap}
.alts button.xalt{border-color:var(--bad);color:var(--bad)}
.chip.xc{border-color:var(--bad)}.chip.xc b{color:var(--bad)}
.card.item.unsuit{opacity:.62;background:repeating-linear-gradient(135deg,var(--card) 0 10px,var(--soft) 10px 20px)}
.card.item.unsuit.sel{opacity:1}
.card.item.unscored{background:var(--soft);border-color:var(--line)}
.card.item.unscored b{color:var(--muted)}
.ntag{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:700;color:var(--ink);background:var(--soft);border:1px dashed var(--muted);border-radius:6px;padding:2px 7px}
.xwarn.nsuit{border-style:dashed}
.chip.must span{font-weight:700}
.mustcb{display:flex;align-items:flex-start;gap:6px;margin:8px 2px 0;font-size:12.5px;line-height:1.35;cursor:pointer}
.pfield label.mustcb,.mustcb{display:flex;align-items:flex-start;gap:8px;width:auto}
.mustcb input[type=checkbox]{width:20px;height:20px;min-height:0;margin:0;padding:0;flex:none;accent-color:var(--accent)}
.mustcb>span{flex:1;min-width:0;text-align:left}
textarea.grow{overflow:hidden;resize:none;min-height:64px}
.d-reason b{font-weight:700}
.mchip.on{background:color-mix(in srgb,var(--accent) 14%,var(--card));border-color:var(--accent);color:var(--accent);font-weight:700}
.vstrip.mwrap{flex-wrap:wrap;overflow:visible}
.mhint{margin:2px 0 6px}
.subs{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.subp{border-left:3px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:10px;background:color-mix(in srgb,var(--accent) 3%,var(--card));padding:6px 6px 6px 8px}
.subh{display:flex;align-items:center;gap:6px;width:100%;font:inherit;font-size:12.5px;text-transform:none;letter-spacing:0;font-weight:700;color:var(--accent);background:none;border:0;padding:2px 2px 6px;text-align:left;cursor:pointer}
.subh .caret{transition:transform .2s}
.subp.closed .subh .caret{transform:rotate(-90deg)}
.subp.closed .subb{display:none}
.subb > .inp{margin:0;box-shadow:none}
.psubs{margin:10px 0 2px 6px;padding-left:8px;border-left:3px solid color-mix(in srgb,var(--accent) 35%,transparent);display:flex;flex-direction:column;gap:8px}
.pfield.collapsed > .psubs{display:none}
.condnote{color:var(--accent);margin:6px 2px 0}
.chip.cc{border-color:var(--accent)}
.avm{display:inline-block;font-size:13px;font-weight:900;line-height:1;margin-right:4px;flex:none}
.avm.av-std{color:#16a34a}.avm.av-opt{color:#eab308}.avm.av-na{color:#9ca3af}
.avnone{align-self:center;margin-left:2px}
.plline.pl{color:var(--ink)}.plline .hit{color:var(--bad)}.plline .miss{color:#b45309}
.pnote{font-size:12px;font-weight:600;margin:4px 0 2px;padding:5px 8px;border-radius:8px}
.pnote.x{color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,transparent)}
.pnote.m{color:#b45309;background:color-mix(in srgb,#f59e0b 12%,transparent)}
.avsel{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.avsel button{display:inline-flex;align-items:center;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 10px;cursor:pointer;opacity:.7}
.avsel button.on{opacity:1;font-weight:700;border-width:2px}
.avsel button.av-std.on{border-color:#16a34a}.avsel button.av-opt.on{border-color:#eab308}.avsel button.av-na.on{border-color:#9ca3af}
details.plist>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:4px;align-items:baseline;font-size:14px}
details.plist>summary::-webkit-details-marker{display:none}
details.plist>summary::before{content:"▸";color:var(--muted);margin-right:4px;transition:transform .2s}
details.plist[open]>summary::before{transform:rotate(90deg)}
details.plist>summary .plh{font-weight:700}
details.plist>summary .pls{color:var(--muted)}
details.plist[open]>summary{margin-bottom:8px}
#avWrap>summary .plh{color:var(--bad)}
.plline{font-size:12px;margin-top:3px;line-height:1.35}
.plline.xl{color:var(--bad);font-weight:600}
.plline.rl{color:var(--ink)}
.fitsub{margin:2px 0 6px 8px;padding-left:8px;border-left:3px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.fitsub .ccond{margin-top:6px}
.fit.req{background:color-mix(in srgb,#7c3aed 9%,transparent);border-radius:10px;padding-left:6px;padding-right:6px}
.chip.req{background:color-mix(in srgb,#7c3aed 12%,var(--soft));border-color:#7c3aed}
.rq{font-size:10px;font-weight:800;color:#7c3aed;border:1px solid #7c3aed;border-radius:5px;padding:1px 4px;margin-right:5px;vertical-align:1px}
.reqbtn{flex:none;font:inherit;font-size:11px;font-weight:700;border:1.5px dashed #7c3aed;color:#7c3aed;background:var(--card);border-radius:999px;padding:3px 8px;margin-right:8px;cursor:pointer}
.reqbtn.on{border-style:solid;background:color-mix(in srgb,#7c3aed 12%,var(--card))}
.preset{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;margin-left:4px;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer}
.preset svg{width:17px;height:17px}
.inp.pending > .top .preset{visibility:hidden}
.psubs .pfield.off .ptoggle{pointer-events:none}.psubs .pfield.off .ptoggle .caret{visibility:hidden}
.hardrow{margin-top:10px}.hardrow .pair{margin-top:4px}
.pfield.conflict{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.ntxt{color:var(--bad);font-weight:600;margin-top:3px}
.dlg-card input{width:100%}
body[data-lockstyle] .lockbtn .lt{display:none!important}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pgrid .btn{white-space:nowrap}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}
.sec-h .btn,.sec-h .link{white-space:nowrap;flex:none}
.sec-h h2{min-width:0}

<body>
<div id="splash" aria-hidden="true"><img src="icons/icon-512.png" alt=""><h1 id="splashT">Product Match</h1></div>
<header class="top">
  <div class="hwrap">
    <div class="htext"><h1 id="title">Product Match</h1><div class="sub" id="subtitle"></div></div>
    <button id="hreset" class="gear hreset" aria-label="Reset inputs to defaults"></button>
    <button id="gear" class="gear" aria-label="Settings"></button>
  </div>
</header>
<main id="view"></main>


<div id="sheet" class="sheet hidden">
  <div class="sheet-card">
    <div class="sheet-head">
      <button class="link" id="sheetCancel">Cancel</button>
      <b id="sheetTitle"></b>
      <button class="link" id="sheetSave">Save</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<input type="file" id="fileIn" accept=".csv,text/csv,text/plain" hidden>
<div id="dlg" class="dlg hidden" role="alertdialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="dlg-card"><b id="dlgT"></b><p id="dlgM"></p>
    <input id="dlgIn" type="text" autocomplete="off" style="display:none;margin:-6px 0 14px">
    <div class="dlg-acts"><button class="btn" id="dlgNo">Cancel</button><button class="btn" id="dlgAlt" style="display:none"></button><button class="btn primary" id="dlgOk">OK</button></div></div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ======================= STATE & STORAGE ======================= */
const KEY = 'productMatch.state.v1';
const $ = s => document.querySelector(s);
const view = $('#view');
// Parameter value types. dec = decimal places of accuracy.
const TYPES = {
  number:  {label: 'Number'},
  percent: {label: '%', unit: '%'},
  text:    {label: 'Text'},
  boolean: {label: 'Y/N'}
};
const BL = {yes: 'Yes', no: 'No', either: 'Either'};
const NUM_RES = ['1', '0.1', '0.01', 'var'];          // Number resolution options
// Description (ⓘ) and Reasoning (graduation cap) open in a modal from a small icon beside the title.
const ICON_INFO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.4" r="1.2" fill="currentColor" stroke="none"/></svg>';
const ICON_CAP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M2 9.5 12 5l10 4.5L12 14z"/><path d="M6 11.6V16c3.4 2.4 8.6 2.4 12 0v-4.4"/><path d="M22 9.5V15"/></svg>';
// kind: 'p' parameter, 'r' product. d / r: whether a description / reasoning exists.
function infoIcons(kind, id, d, r){
  return (d ? `<button type="button" class="ibtn" data-info="${kind}|${id}|d" aria-label="Description">${ICON_INFO}</button>` : '')
    + (r ? `<button type="button" class="ibtn cap" data-info="${kind}|${id}|r" aria-label="Reasoning">${ICON_CAP}</button>` : '');
}
const ICON_AVOID = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3 2 20.5h20z"/><path d="M12 9.5v5"/><circle cx="12" cy="17.6" r="1.1" fill="currentColor" stroke="none"/></svg>';
// Parameters in display order: each controlling parameter followed by its conditional parameters.
const paramOrder = () => { const out = [], add = p => { out.push(p); kidsOf(p).forEach(add); };
  S.parameters.filter(p => !p.cond || !S.parameters.some(q => q.id === p.cond.on)).forEach(add); return out; };
// Availability of a parameter's feature on a product: Standard (green), Available as option (yellow),
// Not available (gray). Unmarked = No information (no check shown).
const AV = {std: 'Standard', opt: 'Available as option', na: 'Not available'};
const avOf = (pr, p) => ((pr.avail || {})[p.id]) || null;
const avMark = a => a ? `<span class="avm av-${a}" title="${AV[a]}" aria-label="${AV[a]}">✓</span>` : '';
// Parameters a product should not be used with, and parameters it requires.
const pnames = ids => (ids || []).map(P).filter(Boolean);
// A parameter is "in use" when entered, its condition is met and (Y/N) the input is Yes.
const inUse = p => !!p && (S.entered || []).includes(p.id) && inVal(p) != null && condMet(p) && (!isBool(p) || inVal(p) === 'yes');
// Lines under a product's name: products not to combine with (tap for the reason), parameters not to
// combine with (in use = flagged), parameters required (not in use = flagged). r: the product's ranking.
const prodLines = (pr, r) => {

  }).join('');
  syncChips($('#list'));
  $('#list').scrollTop = listTop;

function fitRow(p, f){
  const st = f.excluded ? 'excluded' : f.st;
  const wl = (f.excluded ? 'Not relevant' : `Weight: ${f.w}`) + (f.ht ? ' · ' + f.ht : '');
  const lim = f.over ? `<div class="xsmall ntxt">✕ Input is beyond this product's ${esc(f.ht)}.</div>` : '';
  if (isMulti(p)) {
    const lab = a => (a || []).map(id => vlabel(p, id)).filter(Boolean).join(', ');
    const txt = f.excluded ? 'Not relevant' : f.st === 'missing' ? 'No data' : f.st === 'within' ? 'All match' : `${f.d} of ${f.v.length} match`;
    return `<div class="fit ${f.req ? 'req' : ''}" data-fp="${p.id}"><div class="row"><b class="small">${f.excluded ? '' : avMark(f.av)}${f.req ? '<span class="rq">Required</span>' : ''}${esc(p.name)}</b>
      <span class="xsmall muted">Input ${esc(lab(f.v))} · Product ${f.r ? esc(lab(f.r)) : '—'} · ${wl}</span>
      <span class="st c-${st}">${txt}</span></div></div>`;
  }
  if (isBool(p)) {
    const txt = f.excluded ? 'Not relevant' : f.st === 'within' ? 'Matches' : f.st === 'missing' ? 'No data' : 'Does not match';
    return `<div class="fit ${f.req ? 'req' : ''}" data-fp="${p.id}"><div class="row"><b class="small">${f.excluded ? '' : avMark(f.av)}${f.req ? '<span class="rq">Required</span>' : ''}${esc(p.name)}</b>
      <span class="xsmall muted">Input ${BL[f.v]} · Product ${f.r ? BL[f.r] : '—'} · ${wl}</span>
      <span class="st c-${st}">${txt}</span></div></div>`;
  }
  const txt = f.excluded ? 'Not relevant' : f.st === 'within' ? 'Within range' : f.st === 'missing' ? 'No data'
    : (f.d < 0 ? 'Below by ' : 'Above by ') + fmt(Math.abs(f.d)) + (isVar(p) && !byVal(p) ? (Math.abs(f.d) === 1 ? ' position' : ' positions') : p.unit ? ' ' + p.unit : '');
  const sp = sliderSpec(p), e = productExtent(p), d0 = sp.rlo, d1 = sp.rhi;
  let lo = Math.min(d0, e ? e[0] : d0, f.v), hi = Math.max(d1, e ? e[1] : d1, f.v);
  if (hi <= lo) hi = lo + 1;
  const pad = (hi - lo) * 0.04; lo -= pad; hi += pad;
  const pos = x => ((x - lo) / (hi - lo) * 100).toFixed(2);
  const cl = x => Math.max(lo, Math.min(hi, x));   // open-ended ranges run to the edge of the track
  const band = f.r && !f.excluded ? `<div class="band" style="left:${pos(cl(f.r[0]))}%;width:${Math.max(pos(cl(f.r[1])) - pos(cl(f.r[0])), 1.5)}%"></div>` : '';
  const rt = r => !isFinite(r[0]) ? '≤ ' + (isVar(p) ? labOfNum(p, r[1]) : fmt(r[1])) : !isFinite(r[1]) ? '≥ ' + (isVar(p) ? labOfNum(p, r[0]) : fmt(r[0])) : isVar(p) ? varSpan(p, r[0], r[1]) : fmt(r[0]) + '–' + fmt(r[1]);
  return `<div class="fit ${f.req ? 'req' : ''}" data-fp="${p.id}"><div class="row"><b class="small">${f.excluded ? '' : avMark(f.av)}${f.req ? '<span class="rq">Required</span>' : ''}${esc(p.name)}</b>
    <span class="xsmall muted">${f.r && !f.excluded ? esc(rt(f.r)) + (isVar(p) ? '' : ' ' + esc(p.unit)) + ' · ' : ''}${esc(wl)}</span>
    <span class="st c-${st}">${esc(txt)}</span></div>
    <div class="track">${band}<div class="marker b-${st}" style="left:${pos(f.v)}%"></div></div>${lim}</div>`;
}

function renderParams(box, act){
  const n = S.parameters.length;
  // Conditional parameters are listed inside their controlling parameter's card, in parameter order.
  const tops = S.parameters.filter(p => !p.cond);
  const card = (p, i, cnt) => listCard(p.id, i, cnt, p.name, p.cond ? `<span class="ccond">When ${esc(condText(p))}</span>` : '', false, p.details,
      chip('Type', esc(TYPES[p.type].label.split(' ')[0]), '', 'type') +
      (isBool(p) ? chip('Values', 'Yes / No', '', 'type') : isVar(p) ? chip('Values', esc(varList(p).map(v => v.t).join(', ')) || '—', '', 'values') : chip('Allowable', `${fmt(limits(p)[0])} – ${fmt(limits(p)[1])}${p.unit ? ' ' + esc(p.unit) : ''}`, '', 'allow')) +
      (isBool(p) ? '' : chip('Resolution', esc(resText(p)), '', isVar(p) ? 'values' : 'res')) +
      (isMulti(p) ? chip('Selection', 'Multi' + (p.maxSel ? ` (max ${p.maxSel})` : ''), '', 'multi') : '') +
      (p.req ? chip('Ranking', 'Required', 'req', 'req') : '') +
      chip('Default', p.def == null ? '—' : isBool(p) ? BL[p.def] : isVar(p) ? esc(vlabel(p, p.def) ?? '—') : fmt(p.def), '', 'def') +
      chip('Weight', p.weight, '', 'weight'), p.cond ? 'subcard' : '', 'params', p.reason,
      kidsOf(p).length ? `<div class="lsubs">${kidsOf(p).map((c, k, a) => card(c, k, a.length)).join('')}</div>` : '');
  const cards = n ? tops.map((p, i) => card(p, i, tops.length)).join('')
    : `<div class="card muted small">No parameters yet. Select <b>+ Add</b> to define each parameter's name, type, allowable range, weight and description.</div>`;
  act.innerHTML = '<button class="btn primary" id="addP">+ Add</button>';
  box.innerHTML = (
      `${n ? '<p class="listnote">Tap a card to edit. ▲ ▼ reorder; the order is used on the Match tab and in the product editor.</p>' : ''}${cards}
       <p class="listnote">Weight (0–10) is the default for every product. On the Products tab each parameter can be marked not relevant (weight 0) or given its own weight for that product.</p>`) +
    (n ? `<button class="btn primary block" data-go="products">Next: enter products →</button>` : '');
  $('#addP').onclick = () => editParam(null);
  box.onclick = e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const id = t.dataset.id, i = S.parameters.findIndex(p => p.id === id), act = t.dataset.act;
    if (act === 'edit') { const f = e.target.closest('[data-field]'); return editParam(id, f && f.dataset.field); }
    if (act === 'up' || act === 'down') return moveParam(id, act === 'up' ? -1 : 1);
    if (act === 'dup') {
      const src = S.parameters[i], c = JSON.parse(JSON.stringify(src)); c.id = uid('p');
      let nm = src.name + ' (copy)', k = 2;
      while (S.parameters.some(x => x.name.toLowerCase() === nm.toLowerCase())) nm = `${src.name} (copy ${k++})`;
      c.name = nm; S.parameters.splice(i + 1, 0, c);
      S.products.forEach(pr => {
        if (pr.ranges[src.id]) pr.ranges[c.id] = [...pr.ranges[src.id]];
        if (pr.flags[src.id]) pr.flags[c.id] = pr.flags[src.id];
        if (pr.rel[src.id]) pr.rel[c.id] = {...pr.rel[src.id]};
      });
      save(); return afterSave(c.id, true);
    }
    if (act === 'del') {
      const nm = S.parameters[i].name, np = S.products.length;
      askConfirm({title: `Delete parameter "${nm}"?`, ok: 'Delete', danger: true,
        msg: `Its values, weights and relevance will be removed from ${np} product${np === 1 ? '' : 's'}, and its Match input will be cleared. This cannot be undone; export a CSV first if a backup is needed.`}).then(ok => {
        if (!ok) return;
        animateOut(view.querySelector(`[data-card="${id}"]`), () => {
          const k = S.parameters.findIndex(p => p.id === id); if (k < 0) return;
          S.parameters.splice(k, 1);
          S.products.forEach(pr => { delete pr.ranges[id]; delete pr.flags[id]; delete pr.rel[id]; });
          delete S.inputs[id]; S.entered = (S.entered || []).filter(x => x !== id);
          save(); refresh(null, snapshot());
        });
      });
    }
  };
}

function renderProducts(box, act){

      }).join('');

        if (!ok) return;

    <div class="field"><label>Link (optional)</label><input id="fLink" type="url" inputmode="url" autocapitalize="off" autocorrect="off" value="${esc(pr.link || '')}" placeholder="https://…">
      <div class="xsmall muted" style="margin:5px 2px">Opened from the Result section on the Match screen.</div></div>
    <details class="field plist" id="avWrap"><summary><span class="plh">⚠ Do not combine with products:</span> <span id="avSum" class="pls"></span></summary>
      ${S.products.some(o => o.id !== pr.id) ? `<div class="xchips" id="avList">${S.products.filter(o => o.id !== pr.id).map(o => { const on = (pr.avoid || []).includes(o.id);
        return `<button type="button" class="xchip ${on ? 'on' : ''}" data-av="${o.id}" aria-pressed="${on}">${on ? '⚠ ' : ''}${esc(o.name)}</button>`; }).join('')}</div>` : '<div class="xsmall muted">Add other products first.</div>'}
      <textarea id="fAvNote" style="margin-top:8px;min-height:60px" placeholder="Reason, e.g. silver inactivates collagenase (per manufacturer instructions)">${esc(pr.avoidNote || '')}</textarea>
      <div class="xsmall muted" style="margin:5px 2px">Tap a product to mark that the two should not be used together; the mark applies to both products and is shown on the Match screen.</div></details>
    <details class="field plist" id="apWrap"><summary><span class="plh">Do not combine with:</span> <span id="apSum" class="pls"></span></summary>
      <div class="xchips" id="apList">${paramOrder().map(o => { const on = (pr.avoidP || []).includes(o.id);
        return `<button type="button" class="xchip ${on ? 'on' : ''}" data-ap="${o.id}" aria-pressed="${on}">${esc(o.name)}</button>`; }).join('')}</div>
      <div class="xsmall muted" style="margin:5px 2px">Parameters this product is not configurable with. When one is in use on the Match screen (entered; Y/N set to Yes), the product and that input are flagged as a possible mismatch.</div></details>
    <details class="field plist" id="rqWrap"><summary><span class="plh">Requires:</span> <span id="rqSum" class="pls"></span></summary>
      <div class="xchips" id="rqList">${paramOrder().map(o => { const on = (pr.requires || []).includes(o.id);
        return `<button type="button" class="xchip mchip ${on ? 'on' : ''}" data-rq="${o.id}" aria-pressed="${on}">${esc(o.name)}</button>`; }).join('')}</div>
      <div class="xsmall muted" style="margin:5px 2px">Parameters this product requires. When one is not in use on the Match screen, the product and that input are flagged as possibly missing.</div></details>
    <div class="sec-h" style="margin:4px 2px 8px"><label class="small muted" style="font-weight:600">Parameters – check each one relevant to this product and enter its weight (0–10)</label></div>
    <div class="row" style="justify-content:space-between;margin:-4px 0 8px"><button type="button" class="link" id="pExpand">Expand all</button><button type="button" class="link" id="pCollapse">Collapse all</button></div>
    ${fields}
    <div class="field"><label>Description</label><textarea id="fNotes" placeholder="Basis, manufacturer, or notes">${esc(pr.notes)}</textarea></div>
    <div id="fErr" class="small err-text"></div>`,
    () => {
      const name = $('#fName').value.trim();
      if (!name) return 'Enter a product name.';
      const ranges = {}, flags = {}, rel = {}, must = {}, sets = {}, hard = {};
      for (const p of S.parameters) {
        if (isMulti(p)) sets[p.id] = [...document.querySelectorAll(`[data-ms="${p.id}"] .mchip.on`)].map(b => b.dataset.msv);
        if (hardOK(p)) {
          const a = num(document.querySelector(`[data-hlo="${p.id}"]`).value), b = num(document.querySelector(`[data-hhi="${p.id}"]`).value);
          const c = rangeChecks(p, num(document.querySelector(`[data-lo="${p.id}"]`).value), num(document.querySelector(`[data-hi="${p.id}"]`).value), a, b);
          if (c.err.length && document.querySelector(`[data-rel="${p.id}"]`).checked) {
            const pf = document.querySelector(`[data-pf="${p.id}"]`); pf.classList.remove('collapsed'); pf.scrollIntoView({block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth'}); note(pf, null, {quiet: true});
            return `${p.name}: ${c.err.join(' ')}`;
          }
          if (a != null || b != null) hard[p.id] = [a, b];
        }
        if (document.querySelector(`[data-must="${p.id}"]`).checked) must[p.id] = true;
        const on = document.querySelector(`[data-rel="${p.id}"]`).checked;
        const w = num(document.querySelector(`[data-pw="${p.id}"]`).value);
        if (on && (w == null || w < 0 || w > 10)) return `Enter a weight from 0 to 10 for ${p.name}.`;
        rel[p.id] = {on, w: on ? w : (w == null ? p.weight : w)};
        if (isBool(p)) { const v = document.querySelector(`[data-bv="${p.id}"]`).value; if (v) flags[p.id] = v; }
        else if (isMulti(p)) { const r0 = pr.ranges[p.id]; if (r0) ranges[p.id] = r0; }
        else {
          const rv = sel => { const v = document.querySelector(sel).value; return isVar(p) ? (v || null) : conformValue(p, num(v)); };
          const lo = rv(`[data-lo="${p.id}"]`), hi = rv(`[data-hi="${p.id}"]`);
          if (lo != null || hi != null) ranges[p.id] = [lo, hi];
        }
      }
      const avoid = [...document.querySelectorAll('#avList .xchip.on')].map(b => b.dataset.av);
      const requires = [...document.querySelectorAll('#rqList .xchip.on')].map(b => b.dataset.rq);
      const avoidP = [...document.querySelectorAll('#apList .xchip.on')].map(b => b.dataset.ap);
      const avail = {}; document.querySelectorAll('[data-avsel]').forEach(g => { const a = (g.querySelector('.on') || {}).dataset; if (a && a.avv) avail[g.dataset.avsel] = a.avv; });
      Object.assign(pr, {name, link: normLink($('#fLink').value), notes: $('#fNotes').value.trim(), ranges, flags, rel, must, sets: Object.assign(pr.sets || {}, sets), hard, avail, requires, avoidP, avoid, avoidNote: $('#fAvNote').value.trim()});
      if (!id) S.products.push(pr);
      S.products.forEach(o => { if (o === pr) return; const has = (o.avoid || []).includes(pr.id), want = avoid.includes(o.id);
        if (want && !has) (o.avoid = o.avoid || []).push(pr.id); if (!want && has) o.avoid = o.avoid.filter(x => x !== pr.id); });
      save(); afterSave(pr.id, !id);
    },
    () => {
      const q = sel => document.querySelector(sel);
      const check = p => {
        const pf = q(`[data-pf="${p.id}"]`), on = q(`[data-rel="${p.id}"]`).checked;
        let empty, sum;
        const u = p.unit ? ' ' + p.unit : '';
        if (isBool(p)) { const v = q(`[data-bv="${p.id}"]`).value; empty = !v; sum = v ? BL[v] : 'No value'; }
        else if (isMulti(p)) {
          const on = [...document.querySelectorAll(`[data-ms="${p.id}"] .mchip.on`)].map(b => b.textContent);
          empty = !on.length; sum = empty ? 'No values' : on.join(', ');
        } else if (isVar(p)) {
          const a = q(`[data-lo="${p.id}"]`).value, b = q(`[data-hi="${p.id}"]`).value;
          empty = !(a || b); sum = empty ? 'No values' : a && b ? varSpan(p, vnum(p, a), vnum(p, b)) : a ? '≥ ' + vlabel(p, a) : '≤ ' + vlabel(p, b);
        } else {
          const lo = num(q(`[data-lo="${p.id}"]`).value), hi = num(q(`[data-hi="${p.id}"]`).value);
          empty = lo == null && hi == null;
          sum = empty ? 'No values' : lo != null && hi != null ? `${fmt(lo)} – ${fmt(hi)}${u}` : lo != null ? `≥ ${fmt(lo)}${u}` : `≤ ${fmt(hi)}${u}`;
          if (hardOK(p)) { const ha = num(q(`[data-hlo="${p.id}"]`).value), hb = num(q(`[data-hhi="${p.id}"]`).value);
            if (ha != null || hb != null) sum += ` · limit ${ha != null && hb != null ? fmt(ha) + '–' + fmt(hb) : hb != null ? '≤ ' + fmt(hb) : '≥ ' + fmt(ha)}${u}`; }
        }
        pf.classList.toggle('missing', on && empty);
        q(`[data-psum="${p.id}"]`).textContent = on ? sum : 'Not relevant';
        const w = q(`[data-pwarn="${p.id}"]`);
        if (isBool(p)) { w.textContent = ''; return; }
        if (isMulti(p)) { w.textContent = 'Tap each value this product accepts (any combination).'; w.className = 'xsmall muted'; return; }
        if (isVar(p)) {
          const a = q(`[data-lo="${p.id}"]`).value, b = q(`[data-hi="${p.id}"]`).value;
          w.textContent = a && !b ? `Lower value only: accepts ${vlabel(p, a)} and every value numbered above it.` : b && !a ? `Upper value only: accepts ${vlabel(p, b)} and every value numbered below it.` : 'Select from the listed values; the number in brackets is its position. Leave one side blank for a lower-only or upper-only value.';
          w.className = 'xsmall muted'; return;
        }
        const lo = num(q(`[data-lo="${p.id}"]`).value), hi = num(q(`[data-hi="${p.id}"]`).value);
        let m = '', warn = true;
        const hc = hardOK(p) ? rangeChecks(p, lo, hi, num(q(`[data-hlo="${p.id}"]`).value), num(q(`[data-hhi="${p.id}"]`).value)) : {err: [], warn: []};
        pf.classList.toggle('conflict', on && hc.err.length > 0);
        if (hc.err.length || hc.warn.length) { m = hc.err.concat(hc.warn).join(' '); warn = true; }
        else if (lo != null && hi == null) { m = `Lower value only: any input at or above ${fmt(lo)}${u} is within range. ${ruleText(p)}.`; warn = false; }
        else if (hi != null && lo == null) { m = `Upper value only: any input at or below ${fmt(hi)}${u} is within range. ${ruleText(p)}.`; warn = false; }
        else { m = ruleText(p) + '. Leave one side blank for a lower-only or upper-only value.'; warn = false; }
        w.textContent = m; w.className = 'xsmall ' + (warn ? 'warn-text' : 'muted');
      };
      S.parameters.forEach(p => {
        check(p);
        document.querySelectorAll(`[data-lo="${p.id}"],[data-hi="${p.id}"]`).forEach(i => {
          i.oninput = () => check(p);
          // On leaving the field, snap to the parameter's resolution and range.
          i.onchange = () => {
            const v = num(i.value);
            if (v != null && i.tagName === 'INPUT') {
              const c = conformValue(p, v);
              if (c !== v) { i.value = c; flag(i, `${String(v)} → ${fmt(c)}${p.unit ? ' ' + p.unit : ''} (${ruleText(p).charAt(0).toLowerCase() + ruleText(p).slice(1)}).`); }
            }
            check(p);
          };
        });
        const cb = q(`[data-rel="${p.id}"]`);
        if (isBool(p)) q(`[data-bv="${p.id}"]`).onchange = () => check(p);
        document.querySelectorAll(`[data-hlo="${p.id}"],[data-hhi="${p.id}"]`).forEach(i => {
          i.oninput = () => check(p);
          // On leaving, a hard limit is rounded to the parameter's resolution (flagged when changed).
          i.onchange = () => { const v = num(i.value); if (v != null) { const c = roundP(p, v); if (c !== v) { i.value = c; flag(i, `${String(v)} → ${fmt(c)}${p.unit ? ' ' + p.unit : ''} (resolution ${resOf(p)}).`); } } check(p); };
        });
        document.querySelectorAll(`[data-ms="${p.id}"] .mchip`).forEach(b => b.onclick = () => { const on = !b.classList.contains('on'); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); check(p); });
        cb.onchange = () => {
          const pf = q(`[data-pf="${p.id}"]`);
          pf.classList.toggle('off', !cb.checked);
          if (cb.checked) pf.classList.remove('collapsed');
          setTimeout(() => check(p));
          const wi = q(`[data-pw="${p.id}"]`);
          if (cb.checked && (wi.value === '' || Number(wi.value) === 0)) wi.value = p.weight > 0 ? p.weight : 5;
        };
        q(`[data-ptog="${p.id}"]`).onclick = () => q(`[data-pf="${p.id}"]`).classList.toggle('collapsed');
      });
      // Collapsed lists: the selected products are written in the heading.
      const avCount = () => { const t = [...document.querySelectorAll('#avList .xchip.on')].map(b => S.products.find(o => o.id === b.dataset.av).name); $('#avSum').textContent = t.length ? t.join(', ') : 'None'; };
      const pSum = (list, key, sum) => { const t = [...document.querySelectorAll(list + ' .xchip.on')].map(b => P(b.dataset[key]).name); $(sum).textContent = t.length ? t.join(', ') : 'None'; };
      [['#rqList', 'rq', '#rqSum'], ['#apList', 'ap', '#apSum']].forEach(([list, key, sum]) => {
        document.querySelectorAll(list + ' .xchip').forEach(b => b.onclick = () => { const on = !b.classList.contains('on'); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); pSum(list, key, sum); });
        pSum(list, key, sum);
      });
      document.querySelectorAll('[data-avsel] [data-avv]').forEach(b => b.onclick = () => {
        const was = b.classList.contains('on');   // tapping the selected one again clears it (No information)
        b.parentElement.querySelectorAll('[data-avv]').forEach(x => { const on = x === b && !was; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
        const g = b.parentElement, nt = g.querySelector('.avnone'); if (nt) nt.hidden = !!g.querySelector('.on');
      });
      // A field that needs attention inside a collapsed controlling parameter: open the controlling one.
      document.querySelectorAll('.psubs .pfield:not(.collapsed)').forEach(f => { const up = f.parentElement.closest('.pfield'); if (up) up.classList.remove('collapsed'); });
      document.querySelectorAll('#avList .xchip').forEach(b => b.onclick = () => {
        const on = !b.classList.contains('on'), nm = S.products.find(o => o.id === b.dataset.av).name;
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.textContent = (on ? '⚠ ' : '') + nm;
        note(b, null, {quiet: true}); avCount();
      });
      avCount();
      $('#pExpand').onclick = () => document.querySelectorAll('.pfield').forEach(f => f.classList.remove('collapsed'));
      $('#pCollapse').onclick = () => document.querySelectorAll('.pfield').forEach(f => f.classList.add('collapsed'));
      if (!id) $('#fName').focus();
      if (field === 'name') focusField('#fName');
      else if (field === 'desc') focusField('#fNotes');
      else if (field === 'avoid') focusField('#avList');
      else if (field && field.startsWith('pf:')) {
        const pf = q(`[data-pf="${field.slice(3)}"]`);
        if (pf) { pf.classList.remove('collapsed'); const up = pf.parentElement.closest('.pfield'); if (up) up.classList.remove('collapsed'); focusField(pf); }
      }
    });
}

  $('#pfRen').onclick = async () => {

    if (!nm) return;
    PM.list.find(x => x.id === PM.active).name = uniqueProfName(nm, PM.active); saveMeta(); renderSettings();

    if (!nm) return;

/* ======================= CSV ======================= */
// [PARAMETERS] Name, Type, Unit, Range Min, Range Max, Resolution, Step, Values, Rounding, Default, Weight, Description
//   Type: Number / % / Text / Y/N. Resolution: Number = 1 / 0.1 / 0.01 / Variable (0.02 in older files reads as 0.01); % = 1 / 0.1 / 0.01.
//   Step: slider step for Number and %. Numbering (listed values): Ascending / Descending / By value (Number only).
//   Slider (Number, %, Text): Yes / No.
//   Values: Text values or Number (Variable) numbers separated by semicolons; Numbering (Text): Ascending / Descending.
//   Rounding: Nearest / Round up / Round down. Product cells for Variable parameters hold the value text.
// [PRODUCTS]   Product, Description, Link, then per parameter:
//   Type: cm | % | Y/N   (Number accepted for older files)
// [PRODUCTS]   Product, Notes, then per parameter:
//   numeric: "<Name> Lower", "<Name> Upper";  Yes/No: "<Name> Value" (Yes / No / Either)
//   and "<Name> Weight" (0 = not relevant; blank = parameter default)
const TYPE_CSV = {number: 'Number', percent: '%', text: 'Text', boolean: 'Y/N'};
function parseType(t, unit){
  const l = String(t || '').toLowerCase(), u = String(unit || '').trim().toLowerCase();
  if (l.includes('yes') || l.includes('bool') || l.includes('y/n')) return 'boolean';
  if (l.includes('percent') || l.includes('%')) return 'percent';
  if (l.includes('text')) return 'text';
  if (!l && u === '%') return 'percent';
  return 'number';   // Number; earlier 'cm' and 'length' types are Numbers
}
const cell = v => { v = String(v ?? ''); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function toCSV(d = S){
  const rows = [['[SETTINGS]'], ['Title', d.title], [], ['[PARAMETERS]'],
    ['Name', 'Type', 'Unit', 'Range Min', 'Range Max', 'Resolution', 'Step', 'Values', 'Numbering', 'Selection', 'Max Selections', 'Slider', 'Rounding', 'Default', 'Weight', 'Description', 'Reasoning', 'Condition Parameter', 'Condition', 'Ranking', 'Ranking Switch']];
  d.parameters.forEach(p => rows.push([p.name, TYPE_CSV[p.type], p.unit,
    isList(p) ? '' : plain(p.min), isList(p) ? '' : plain(p.max),
    isBool(p) || p.type === 'text' ? '' : isNumVar(p) ? 'Variable' : plain(resOf(p)),
    p.type === 'percent' || (p.type === 'number' && !isNumVar(p)) ? plain(stepOf(p)) : '',
    isVar(p) ? varList(p).map(v => v.t).join('; ') : isNumVar(p) ? numList(p).join('; ') : '',
    isList(p) ? (byVal(p) ? 'By value' : p.dir === 'desc' ? 'Descending' : 'Ascending') : '',
    isList(p) ? (isMulti(p) ? 'Multi' : 'Range') : '', isMulti(p) ? plain(p.maxSel) : '',
    isBool(p) ? '' : (p.slider === false ? 'No' : 'Yes'),
    isBool(p) || isList(p) ? '' : ROUND[p.round],
    p.def == null ? '' : isBool(p) ? BL[p.def] : isVar(p) ? (vlabel(p, p.def) ?? '') : plain(p.def), plain(p.weight), p.details, p.reason || '',

$('#fileIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const text = await f.text(), group = splitProfiles(text);
    if (group) {   // file with several profiles: each becomes a new profile
      const parsed = group.map(g => ({name: g.name, ...fromCSV(g.text)}));
      if (!(await askConfirm({title: `Import ${parsed.length} profiles?`, ok: 'Import', msg: `Each profile in ${f.name} is added as a new profile (${parsed.map(x => x.name).join(', ')}). Existing profiles are not changed; duplicate names are numbered.`}))) return;
      save();
      parsed.forEach(x => addProfile(x.name, Object.assign(blank(), {title: x.data.title || x.name, parameters: x.data.parameters, products: x.data.products})));
      const nts = parsed.filter(x => x.notes.length).map(x => `${x.name}: ${x.notes.join(' ')}`);
      renderSettings();
      askConfirm({title: 'Import complete', cancel: false, msg: `Added ${parsed.length} profiles. Select one under Active profile.` + (nts.length ? '\n\n' + nts.join('\n') : '')});
      return;
    }
    const {data, notes} = fromCSV(text);
    const base = data.title || f.name.replace(/\.csv$/i, '').replace(/^ProductMatch-(Settings-)?/i, '');
    const empty = !S.parameters.length && !S.products.length;
    const how = empty ? 'alt' : await askConfirm({title: 'Import CSV', ok: 'New profile', alt: 'Replace current', danger: false,
      msg: `${f.name}: ${data.parameters.length} parameters and ${data.products.length} products.\n\nAdd it as a new profile, or replace the data in "${profName()}"?`});
    if (!how) return;
    if (how === 'alt') {
      if (!empty && !(await askConfirm({title: `Replace "${profName()}"?`, ok: 'Replace', danger: true, msg: 'The parameters, products and inputs in this profile will be replaced. Other profiles are not changed.'}))) return;
      S.title = data.title || S.title; S.parameters = data.parameters; S.products = data.products; S.inputs = {}; S.selectedId = null; S.entered = [];
      fix(S); save(); openSettings('data');
    } else {
      const nm = await askConfirm({title: 'New profile name', ok: 'Import', input: uniqueProfName(base)});
      if (!nm) return;
      save();
      const id = addProfile(nm, Object.assign(blank(), {title: data.title || nm, parameters: data.parameters, products: data.products}));
      if (id) switchProfile(id);
    }
    askConfirm({title: 'Import complete', cancel: false, msg: `Imported ${data.parameters.length} parameters and ${data.products.length} products into "${profName()}".` + (notes.length ? '\n\n' + notes.join('\n') : '')});

};
// A group file holds several profiles, each starting with a "[PROFILE],<name>" row.
function splitProfiles(text){
  const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
  if (!lines.some(l => /^"?\[PROFILE\]"?\s*(,|$)/i.test(l))) return null;
  const out = []; let cur = null;
  for (const l of lines) {
    if (/^"?\[PROFILE\]"?\s*(,|$)/i.test(l)) { const r = parseRows(l)[0] || []; cur = {name: (r[1] || '').trim() || 'Profile ' + (out.length + 1), text: ''}; out.push(cur); }

    ['Product C', 'Example only', 'https://example.com/product-c', [1, 15], [0, 75], null, 'yes', {3: {on: false, w: null}, 0: {on: true, w: 3}}, [3, 7]]
  ];
  const L = params[2].vals.map(v => v.id);   // None, Light, Moderate, Heavy
  const N = params[4].vals.map(v => v.id);   // 1, 2, 3, 5, 7
  params[4].def = N[2];
  rows.forEach(r => { r[8] = [N[[1, 2, 3, 5, 7].indexOf(r[8][0])], N[[1, 2, 3, 5, 7].indexOf(r[8][1])]]; });
  params[2].def = L[2];
  rows[0][5] = [L[1], L[2]]; rows[1][5] = [L[2], L[3]]; rows[2][5] = [L[0], L[1]];
  const products = rows.map(r => {
    const rel = {}; Object.entries(r[7]).forEach(([i, v]) => rel[params[i].id] = v);
    return {id: uid('r'), name: r[0], notes: r[1], link: r[2], ranges: {[params[0].id]: r[3], [params[1].id]: r[4], [params[2].id]: r[5], [params[4].id]: r[8]}, flags: {[params[3].id]: r[6]}, rel};
  });
  return {title: 'Example Selector', parameters: params, products, inputs: {}, tab: null, selectedId: null, lastExport: null};
}

/* ======================= START ======================= */
// Load the active profile only after all helpers exist; if stored data cannot be read it is left
// untouched (not overwritten) and the app opens empty.
S = load();
if (!readOnly) save(); else toast('Saved data for this profile could not be read; it is kept unchanged and changes are not saved.');
// Match is the opening view. The sections open as they were last time; on first use (no saved view)
// all three are expanded.
S.collapsed = S.collapsed || {};
if (MKEYS.every(k => S.collapsed[k] === undefined)) MKEYS.forEach(k => S.collapsed[k] = false);
// Splash: logo and title for 1 second.
{
  const sp = $('#splash'); $('#splashT').textContent = S.title || 'Product Match';
  // Android shows its own launch screen for an installed app, so the in-app splash is skipped there.
  const androidApp = /Android/i.test(navigator.userAgent) && window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: minimal-ui)').matches);
  if (androidApp) sp.remove();
  else setTimeout(() => { sp.classList.add('hide'); setTimeout(() => sp.remove(), 400); }, 1000);
}
document.body.setAttribute('data-lockstyle', '3');   // (not data-lock: that attribute marks the lock button)
setTab('match');
const relayout = () => { if (S.tab !== 'settings') layoutMatch(); };
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', () => setTimeout(relayout, 300));
window.addEventListener('pageshow', () => setTimeout(relayout, 50));
if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
setTimeout(relayout, 400);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
// Updates: the page is fetched from the network first, and when a new service worker takes control the
// app reloads once, so a single launch while online shows the latest version.
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const had = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloaded) { reloaded = true; save(); location.reload(); } });
  navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(r => r.update()).catch(() => {});
}
